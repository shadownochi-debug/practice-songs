const q=document.getElementById('q'),list=document.getElementById('list'),filters=document.getElementById('filters'),count=document.getElementById('count');let f='全部';
function render(){const term=q.value.trim().toLowerCase();let arr=songs.filter(s=>!term||(s[0]+' '+s[1]).toLowerCase().includes(term));if(f==='有音檔')arr=arr.filter(s=>s[3]);if(f==='待補')arr=arr.filter(s=>!s[3]);count.textContent=`共 ${arr.length} 首｜目前 ${songs.filter(s=>s[3]).length} 首有音檔`;list.innerHTML=arr.length?arr.map(s=>`<div class="song"><div class="en">${s[0]}</div><div class="cn">${s[1]}</div><div class="meta">${s[2]?'法本 p.'+s[2]:'法本頁碼未標示'}</div>${s[3]?`<div class="play">🎧 已有音檔</div><audio class="audio" controls preload="none" src="${A+encodeURIComponent(s[3]).replace(/%2F/g,'/')}"></audio>`:'<div class="play">○ 待補音檔</div>'}</div>`).join(''):'<div class="empty">找不到符合的歌曲</div>'}
function setF(x){f=x;filters.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.f===x));render()}

</script></body></html>
