px;color:#8a7d70;margin-bottom:11px}.player{border:1px solid #e0d6ca;border-radius:12px;padding:10px;margin:9px 0 14px}.player small{display:block;color:#776d62;margin-bottom:5px}audio{width:100%;height:40px}.lyrics{font-size:16px;line-height:1.9}.lyrics p{margin:0 0 7px;white-space:pre-wrap}.notice{padding:18px;text-align:center;color:#8a7d70;line-height:1.7}.count{font-size:11px;color:#8a7d70;margin:0 2px 10px}.foot{font-size:11px;color:#8a7d70;line-height:1.7;margin-top:15px}</style></head><body><div class="wrap"><h1>🇳🇵 尼泊爾三日共修</h1><div class="sub">2026/10/28–10/30｜諦雅寺<br>依「尼泊爾共修維那對照課表」整理｜英文先行・中文對照・法本頁碼</div><input id="q" class="search" placeholder="搜尋中文歌名、English title、頁碼…"><div id="days" class="days"></div><div id="sessions" class="sessions"></div><main id="app"></main><div class="foot">※ Session 3 為個人修持，不列固定共修歌曲。Session 5 為道歌練習與迴向。未上傳音檔者仍保留在正確場次，並標示「尚無音檔」。</div></div><script>

const L={
'梵文三皈依':`Namas Tasmai Bhagavate Arhate\nSamyak Sambuddhāya\nBuddhaṃ Śaraṇaṃ Gacchāmi\nDharmaṃ Śaraṇaṃ Gacchāmi\nSaṅghaṃ Śaraṇaṃ Gacchāmi\nDvitīyaṃ Api\nBuddhaṃ Śaraṇaṃ Gacchāmi\nDharmaṃ Śaraṇaṃ Gacchāmi\nSaṅghaṃ Śaraṇaṃ Gacchāmi\nTṛtīyaṃ Api\nBuddhaṃ Śaraṇaṃ Gacchāmi\nDharmaṃ Śaraṇaṃ Gacchāmi\nSaṅghaṃ Śaraṇaṃ Gacchāmi`,
'皈依發心':`諸佛正法聖僧眾 直至菩提我皈依\n以我布施等功德 為利眾生願成佛\n（三遍）`,
'發菩提心願文':`如昔諸善逝 先發菩提心\n復次循序住 菩薩諸學處\n如是為利生 我發菩提心\n復於諸學處 次第勤修學\n（三遍）`,
'四無量心':`願一切有情具樂及樂因，\n願一切有情離苦及苦因，\n願一切有情具喜及喜因，\n願一切有情，遠離怨親愛憎，\n常住大平等捨。\n（三遍）`,
'大手印傳承祈請文':`金剛總持帝洛那洛巴 瑪巴密勒法王岡波巴\n普明三世遍知噶瑪巴 四大八小傳承持有者\n止達察派具德竹巴等 於甚深道大印得自在\n達波噶舉無比眾生怙 於諸口傳上師作祈請\n持有傳承記述祈加持\n教云離欲即為修行足 於諸飲食財寶無繫念\n斷離此生貪網之行者 無著名聞利養祈加持\n教云虔敬即為修行首 上師開啟口訣寶藏門\n於諸恆常祈請之行者 加持生起無偽之虔敬\n教云無逸即是修正行 妄念隨顯體性自鮮明\n住於任運無整之行者 離於禪修之念祈加持\n教云妄念體性即法身 所顯非真宛然而顯現\n不滅幻有顯現之行者 證悟輪涅無二祈加持\n世世不離清淨上師尊 受用殊勝吉祥之法教\n五道十地功德悉圓滿 願速證得金剛持果位`,
'度母頌':`聖解脫者度母眷屬眾 往昔摯愛誓言請憶持\n掃除我及有情之恐懼 淨除疾病礙魔與逆緣\n促使順緣圓滿而昌盛 世俗無上悉地請賜予\n嗡達咧 嘟達咧 嘟咧 梭哈（四遍）`,
'白度母祈請文':`眾生皆為執實念所苦 祈爾無我智眼視眾生\n三界輪迴之苦除滅者 度母如意輪寶除死懼\n祈賜無上共通之悉地\n嗡達咧 嘟達咧 嘟咧 梭哈\n嗡達咧 嘟達咧 嘟咧 瑪瑪 阿優 布涅 嘉納 布真咕嚕 梭哈`,
'度母本尊修持':`我身即聖度母顯空相 諸音聲空自然之咒音\n心即明空度母證悟心 心即明空聖度母之心\n以此光耀歌舞三昧力 我將饒益不同有情眾\n願予眾生快樂與歡喜 願予眾生快樂與歡喜\n嗡達咧 嘟達咧 嘟咧 梭哈（三遍）`,
'聖救度佛母二十一種禮讚經':`唵敬禮尊聖救度母\n敬禮多哩速疾勇 咄多哩者除怖畏\n咄哩能授諸勝義 具莎訶字我讚禮\n敬禮救度速勇母 目如剎那電光照\n三世界尊蓮華面 從妙華中現端嚴\n敬禮百秋朗月母 普遍圓照無垢面\n如千星宿俱時聚 殊勝威光超於彼\n敬禮紫磨金色母 妙蓮華手勝莊嚴\n施精勤行柔善靜 忍辱禪定性無境\n敬禮如來頂髻母 最勝能滿無邊行\n得到彼岸盡無餘 勝勢佛子極所愛\n敬禮怛囉吽字母 聲愛方所滿虛空\n運足遍履七世界 悉能鉤召攝無餘\n敬禮釋梵火天母 風神自在眾俱集\n部多起屍尋香等 諸藥叉眾作稱歎\n敬禮特囉胝發母 於他加行極摧壞\n展左踡右作足踏 頂髻熾盛極明耀\n敬禮都哩大緊母 勇猛能摧怨魔類\n於蓮華面作顰眉 摧壞一切冤家眾\n敬禮三寶嚴印母 手指當心威嚴相\n嚴飾方輪盡無餘 自身熾盛光聚種\n敬禮威德歡悅母 寶光珠蔓眾光飾\n最極喜笑睹怛哩 鎮世間魔作攝伏\n敬禮守護眾地母 亦能鉤召諸神眾\n搖顰眉面吽聲字 一切衰敗令度脫\n敬禮頂冠月相母 冠中現勝妙嚴光\n阿彌陀佛髻中現 常放眾妙寶光明\n敬禮如盡劫火母 安住熾盛頂髻中\n普遍喜悅半趺坐 能摧滅壞惡冤輪\n敬禮手按大地母 以足踐蹋作鎮壓\n現顰眉面作吽聲 能破七險鎮降伏\n敬禮安穩柔善母 涅槃寂滅最樂境\n莎訶命種以相應 善能消滅大災禍\n敬禮普遍極喜母 諸怨支體令脫離\n十字咒句妙嚴布 明咒吽聲常朗耀\n敬禮都哩巴帝母 足躡相勢吽字種\n彌嚕曼陀結辣薩 於此三處能搖動\n敬禮薩囉天海母 手中執住神獸像\n誦二怛囉作發聲 能滅諸毒盡無餘\n敬禮諸天集會母 天緊那羅所依愛\n威德歡悅若堅鎧 滅除鬥諍及惡夢\n敬禮日月廣圓母 目睹猶勝普光照\n誦二喝囉咄怛哩 善除惡毒瘟熱病\n敬禮具三真實母 善靜威力皆具足\n藥叉執魅尾怛辣 都哩最極除災禍\n若有智者勤精進 至心誦此二十一`,
'德謙讓卓上師相應法':`諸顯相顯空不二 即是上師證悟身\n諸音響聲空不二 即是上師證悟語\n想法記憶皆明空 即是上師證悟心\n遠離成阻之上師 上師祈請鑑知我\n平等性之上師尊 上師祈請鑑知我\n顯空不二如彩虹 如是色相赤裸觀\n聲空不二如迴音 如是聲音凝神聽\n明空不二難言喻 心之自性如是見\n無執自在於本然 寬坦鬆緩啊啊啊`,
'金剛持堪千竹清嘉措仁波切上師相應法':`自頂獅座蓮花上 日月墊上眾部主\n具德上師金剛持 身如無雲晴空色\n一面二臂具鈴杵 方便智慧之雙運\n手印持於心間處 金剛跏趺姿而坐\n悅麗嚴飾衣裝具 思前對心積淨者\n為主並置諸有情\n密嚴法界之宮殿 三時諸佛之體性\n明示自心即法身 頂禮具德聖上師\n身語受用意化現 獻諸供養並禮讚\n懺悔往昔諸罪障 往後不復更造罪\n隨喜一切有情善 迴向最勝菩提因\n祈不入涅恆住世 啟轉無上勝乘法\n無方熟稔慈與悲 勝義俱生之本智\n如佛菩薩之證悟 加被吾現前了悟\n供養曼達\n大地塗香敷妙花 須彌四洲日月嚴\n觀為佛國作供獻 有情咸受清淨剎\n嗡 曼扎 布紮梅嘎 薩母扎 薩帕惹那 薩嘛耶 啊吽\n上師仁波切 實義傳承者 聖化之傳遷者 證悟定量者\n具神通與五眼 神變嚴置教示 賜難承受大恩 執手交付佛果\n轉化凡夫俗相 示現清淨廣大 聖者觀世自在 吾以徹骨深心\n虔心悲切祈請 祈求慈悲攝受\n成就雄銳力者 噶舉無可辯駁 調伏兇殘之力 無與倫比事業\n圓滿淨妙佛陀 我以三門善根 為了無邊有情 唯此當下供養\n大慈憫而納受 於一切有情中 恆救護之上師 由心賜與加持\n能如師尊一般 噶瑪巴千諾`,
'蓮師妄念自解脫祈請文':`顯現於眼所見一切相 內在外在一切之萬法\n情器世間諸法雖顯現 令其安住遍尋無我處\n所執色法悉皆淨化時 即本尊身明空不二也\n貪欲已自解脫之上師 鄔金貝瑪炯內我祈請\n顯現於耳所聞一切音 執取諸音悅意不悅意\n令其安住聲空不二境 離一切念超越諸想像\n諸音空性無生亦無滅 如是即成勝利者教法\n勝者教法聲空不二也 鄔金貝瑪炯內我祈請\n心隨境轉一切之移動 諸念孳生五毒與煩惱\n令諸念心無造作安住 莫思往昔莫臆測未來\n若令驛動安住於原處 一切驛動解脫入法身\n覺性已自解脫之上師 鄔金貝瑪炯內我祈請\n祈請賜予加持令淨化 外在所攝對境之顯相\n祈請賜予加持令解脫 內在心理運作能覺心\n祈請加持能所二元間 明光將證本來之面目\n三世一切善逝悲心中 祈請加持我心得解脫`,
'迎請——蓮師七句祈請文':`吽\n鄔金剎土西北隅，蓮花花莖胚芽上，\n稀有殊勝妙成就，得大名稱蓮花生，\n周圍空行眾圍繞，我隨本尊勤修持，\n祈賜加持祈降臨，咕嚕貝瑪悉地吽。\n（七遍）\n嗡啊吽 班札咕嚕 貝瑪 悉地吽`,
'第十七世法王噶瑪巴長久住世祈請文':`第二佛陀鄔金海生尊 三密門之佛業攝一舞\n諸佛之主蓮足願常固 如海經劫常駐金剛界`,
'勸請至要誓願':`嗡梭諦\n遍主本初依怙金剛持 根傳持明上師諸聖眾\n速勇度母等殊勝本尊 具誓護法祈賜真加持\n密嚴淨土教主金剛持 此時示現人道之色身\n一切苦痛眾生之依怙 由法界中利生祈降臨\n乃至虛空壇城未盡時 慈憫一切眾生三摩地\n法界無有中邊恆相擁 事業恆無間斷願熾盛\n三根本及天女加持力 吾等信心悲切而祈請\n化身月容再現而盈滿 重現教眾安樂之光明`,
'加持雨降任顯豁然曲':`南無咕嚕\n客塵清淨自生之本智 離於破立取捨光殼中\n身智本然法性之上師 自識本貌性中作祈請\n大空命之明點耀攝舞 和合相好韶華明朗現\n嘿嚕嘎尊報身之上師 心氣無二性中作祈請\n三匯處之熾燃拙火舌 無餘焚毀蘊執為塵埃\n燃滴融於中脈上師尊 溶樂俱生性中作祈請\n顯聲覺於上師舞中現 悲智雄力加持住自心\n四灌密意心意相融已 祈賜二利任運之加持`,
'天笛之哀呼':`南無咕嚕班扎達惹雅（敬禮上師金剛持）\n智慧多聞深解經咒義 圓證深教明睿廣通達\n事業浩瀚教眾之榮光 具格賢善知識護念我\n心意無漏交輝如雲鬘 融於無遮法身之天際\n色身示現日落而西沉 我心難忍哀呼上師尊\n戒律圓淨藏紅法袍嚴 無逸禪定全大勇觀行\n寶有全知燦爛知識海 痛切祈請無比之上師\n講辯著作宣經續密意 內住等持證悟登王座\n托舉解行大日具力者 教證佛法棟樑尊恆念\n氣脈明點中脈和合中 三顯次第消融四空舞\n幻身虹彩明光大樂身 呼喚雙運自解尊勝師\n無緣空性離戲之法界 真如不壞俱生大本智\n無別無漏密意虛空中 祈賜加持甘露潤我心\n生生世世戒律恆清淨 經咒大海思維智慧依\n明睿勝者運籌帷幄力 大樂無漏果位自解脫`,
'殷切虔敬曲':`上師知 上師知 上師知\n當下心性有如虛空時 我父大恩上師之法身\n真實佛陀德謙讓卓知 祈賜心意合一之悉地\n當下顯相無非明光時 我父大恩上師報身圓\n真實佛陀德謙讓卓知 祈賜心意雙運之悉地\n當下心顯皆為遊戲時 我父大恩上師之化身\n真實佛陀德謙讓卓知 祈賜心意不離之悉地\n勝義上師尊之大悲藏 常住我虔敬心永不離\n我此自心一如上師般 祈賜加持當下即了悟\n從來無聚無散虔敬中 自心若能無疑作祈請\n大愛悲心不倦恆看護 賜與師心無別之悉地\n首先殷切祈請外上師 其次與內上師心合一\n最終一味無別本解脫 利樂無盡有情大願成`,
'竹慶本樂仁波切長久住世祈請文':`普賢乘經典海之精華 了義明光心要大傳承\n佛法寶幢弘揚遍十方 祈願勝德上師長住世`,
'竹慶本樂仁波切佛行事業昌盛祈請文':`大圓滿秘密藏持有者 善教具器弟子了義法\n經典教理勝幢持有者 真善知識佛行願昌盛`,
'阿拉桑噶仁波切長久住世祈請文':`密咒明咒陀羅尼三咒 執持咒傳白袍化身者\n能仁教法皓日放千光 三信心意虛空恆光耀\n大悲護祐困苦有情眾 深懷信心供養三珍寶\n利樂光燦蓮池盛綻放 究竟願證無二本智身`,
'諦雅竹奔仁波切長久住世祈請文':`為教為眾清淨勝意樂 不動聰慧執持妙事蹟\n噶瑪賢遍羅卓仁波切 蓮足永固事業恆昌盛\n如於前世祈願所發心 究竟厭離清淨出離心\n正法修持穩固如高山 精要教法持者願吉祥\n不虛殊勝三寶皈依處 無死壽尊加持真諦力\n我等虔信意樂眾善力 所願如是任運願成辦`,
'傳承上師長久住世祈請文':`祈請上師法體得安康 祈請最勝壽命恆綿長\n祈請事業弘揚且興盛 祈賜加持與師不分離\n祈願盛德上師蓮足固 等虛空眾悉皆生喜樂\n自他無餘積資淨障已 得能迅速登入諸佛地`,
'菩提心祈願文':`菩提證悟心 永為快樂因 諸佛所讚歎\n清音宣流際 以其真實義 眾皆大歡喜\n天魔及夜神 餓鬼等僕從\n清音宣流際 願生慈愛心\n勞役之家畜 野生珍稀物\n清音宣流際 不畏捕殺怖\n福田聖僧眾 清音宣流際 遠離諸病苦\n得見深般若 當如觀世音 廣利無邊眾`,
'菩提心願偈':`勝菩提心寶 未生令生起\n生已無退轉 願輾轉增長`,
'龍樹菩薩迴向文':`以此功德願眾生 圓滿福德與智慧\n以此福德智慧故 願能證得二妙身`,
'密勒日巴迴向文':`願君長壽離病苦 受用自在與福樂\n來世淨土願相逢 願君修行利眾生`,
'堪布仁波切迴向文':`願善惡緣諸眾生 捨此迷惑妄想境\n西方淨土速願往 五道十地圓滿成`,
'那爛陀菩提祈願文':`聖境賢哲五明生源處 世界勝嚴吉祥那爛陀\n願以精進聞思修次第 將此世間置於三菩提`,
'世界啊！':`世界啊我們在您懷裡生生死死\n我們的苦樂在您身上自然舞動\n您是我們的家從古至今\n我們永遠珍惜您\n願您化為那夢中的淨土\n一切平等無私的國度\n與慈愛溫柔的天女\n擁抱著您的冀盼堅定不移\n您是最親的滋養\n切莫任意展露您黑暗的一面\n我們要讓您的一方一土成為和平良田\n千萬幸福的果實自由芬芳\n圓滿成熟我們無盡的期望`,
'法身城':`我知顯相皆幻化 我執之病已去除\n二元輪鍊不能縛 戰勝不動法身城`,
'吉祥光照全宇宙':`Namo Guru Hasa Vajra Ye\n（頂禮上師喜笑金剛）\n親見輪涅萬法僅緣起 且見緣起心要即法性\n以此力故祥光照宇宙 喜笑金剛屹立我心中\n了知根之實相離概念 且知緣起顯相如水月\n以此盡除邪見與疑黯 祈願吉祥光照全宇宙\n智慧照見萬法真實義 如母愛子利樂有情眾\n威力轉化仇敵為弟子 祈願吉祥光照全宇宙\n輪迴之因我執最勝藥 即是了知無我正法故\n以息眾生我執迷惑力 祈願吉祥光照全宇宙\n已然捨離凡夫世間法 了知勝義實相之聖眾\n引導凡夫入於寂滅道 祈願吉祥光照全宇宙\n賜予二種成就之本尊 與除惡緣障礙護法神\n盡除道上一切之違緣 祈願吉祥光照全宇宙\n以此世界一切之方所 無害寂靜善道盛行力\n關愛之心相互深連結 祈願吉祥光照全宇宙\n願此極盛豐饒之世紀 不生財富利益之紛擾\n願享無爭無害之妙欲 祈願吉祥光照全宇宙\n願此科學極盛之世紀 如同天人受用之機器\n悉成無害和平勝方便 祈願吉祥光照全宇宙\n祈願外在物質之科學 結合內在心靈之科學\n以此善息心之謬誤力 祈願吉祥光照全宇宙\n如是吉祥之光所生源 即是光明心之本質故\n心之本質如是了知已 善妙祥光何等燦爛也\n願此吉祥之光燦然處 皆以慈悲最勝菩提心\n生起自他二者平等心 祈願善妙祥光不減損`,
'八無拒':`Namo Ratna Guru\n（頂禮寶上師）\n以三身藥之施予 令等虛空眾有情\n消除滅盡痛苦病 禮敬尊勝樂惠施\n心性虛空清淨處 若為惡業雲覆聚\n即以本智大風力 無拒本淨如是行\n病痛無基亦無根 無作清新鬆坦住\n離言與思法身顯 無拒病痛本清淨\n惑相魔障之神變 唯心而離生滅戲\n離諸懼怖與怯弱 無拒鬼神本清淨\n四大疾病眾苦痛 若病或癒離貪瞋\n具無漏樂之妙味 無拒煩惱本清淨\n諸種苦樂高與低 知其無實成道伴\n希懼取捨盡遠離 無拒輪迴本清淨\n人生總為病逼惱 莫視為錯莫厭棄\n一味之行出莊嚴 無拒痛苦本清淨\n昏沉掉舉之心識 即是法性本無垢\n不思除滅之心想 無拒愚癡本清淨\n由無始來之串習 如幻心念紛然現\n不修空而離執實 無拒妄念本清淨\n無有生死之俱生 知生滅住亦無存\n無為寬廣大境界 無拒死亡本清淨\n此八無拒本清淨 是需反修入一味\n是尊叔侄心意趣 是破魔軍之力鎚\n是我乞人之修行 是遊山間之順緣\n是成二利最勝樂 老父已知汝當行`,
'瑜伽十八樂':`敬禮善妙上師足。\n我以善樂福德故 得見尊顏受法教\n一如上師之授記 我今依囑來居此\n蒙境群山多樹木 草原花木極茂盛\n於此悅意安樂堡 果樹搖擺作舞姿\n猿猴撲跌作遊戲 百鳥齊喧悅耳聞\n蜜蜂四飛競嗡嗡 虹彩隱顯無晝夜\n冬夏細雨降霏霏 春秋谷霧瀰山際\n如是寂寥山隱處 有我密勒習禪定\n觀心空性明光樂 思緒眾多極快樂\n猛起狂跌更加樂 無有惡業人身樂\n各種紛亂極快樂 恐怖大增更加樂\n煩惱生滅解脫樂 迫害越深越快樂\n若無病痛更加樂 苦痛成樂此亦樂\n體悟流露運動樂 跑跳舞蹈更加樂\n語王妙歌寶藏樂 語如蜂鳴極快樂\n聲成福德更加樂 心具大勇廣大樂\n自力自顯極快樂 萬千境顯大喜樂\n為酬信徒來朝拜 我今歌此作禮物\n告汝法喜諸覺受 修士種種大歡樂`,
'大手印、大圓滿、大中觀要義':`啊啊\n具信勤智善緣諸弟子 但觀無生離戲心實相\n緣處之相滅卻定信生 無勤無破無立住本然\n樂空離言心性之體性 堂堂視之鬆鬆無執住\n自解樂空法界光明中 直觀顯空無生心遊戲\n越心本淨自生之明覺 執見地之善執自然滅\n虹與光之明點紛然現 執相為實之念盡滅卻\n大圓滿之行者樂陶然`,
'五毒自解脫':`莫隨瞋恨之對境，且觀瞋恨之自心，\n瞋恨自生自解脫，即是明空之本性，\n明空不二非其他，即是大圓鏡智也，\n於彼瞋恨自解中，念誦六字大明咒。\n嗡嘛呢唄咩吽（四遍）\n莫執傲慢之對境，且觀執取之自心，\n執取自身最殊勝，自生自解本空性，\n本空之性非其他，即是平等性智也，\n於彼傲慢自解中，念誦六字大明咒。\n嗡嘛呢唄咩吽（四遍）\n莫執貪欲之對境，且觀執著之自心，\n執著自生自解脫，即是樂空之本性，\n樂空不二非其他，即是妙觀察智也，\n於彼貪欲自解中，念誦六字大明咒。\n嗡嘛呢唄咩吽（四遍）\n莫迷嫉妒之對境，且觀細察之自心，\n細察自生自解脫，即是智空之本性，\n智空不二非其他，即是成所作智也，\n於彼嫉妒自解中，念誦六字大明咒。\n嗡嘛呢唄咩吽（四遍）\n莫再誤解愚癡境，且觀愚癡之自身，\n念頭自生自解脫，即是覺空之本性，\n覺空不二非其他，即是法界體性智，\n於彼愚癡自解中，念誦六字大明咒。\n嗡嘛呢唄咩吽（四遍）`,
'朋友':`遠離貪著、充滿愛的瑜伽士與瑜伽女\n朋友即是空相 猶如水中月\n設若執以為實 徒令痛苦增\n若知皆是空相 猶如水中月\n如幻三昧增長 無執悲增長\n無焦點見增長 離執修增長\n遠離能作所作 行持將增長\n一切奇蹟之中 最大的奇蹟\n一切美妙之中 無上的美妙`,
'法王松贊甘布勝住開光吉祥文':`敷設廣大供養具 登壇城已持香華\n合掌啟白諦實語 合掌啟白諦實語\n兩足能仁釋迦子 化身無數利群生\n一切如來勝導師 十方諸佛賜吉祥\n善巧大悲之續流 調伏成熟令解脫\n聖者觀自在尊等 願諸菩薩賜吉祥\n清淨無垢勝法教 以四攝事興正法\n佛子善現尊者等 願聖長老賜吉祥\n所有十方淨土中 三世一切諸如來\n以及菩提薩埵等 願賜灌頂祈降臨\n最勝化身法中王 妙演諦實力之時\n諸佛本尊護法眾 如日光塵雲煙雨\n遍滿諸佛所散華 佛子敷演菩薩行\n梵天普降大華雨 天女妙獻諸供養\n天樂於中出妙音 方所遍滿勝妙香\n智慧薩埵滿虛空 與誓言尊無二住\n諸天無量妙言辭 稱歎最勝法王已\n於此最勝二殿堂 吉祥勝住任運成\n照見萬法如鏡影 歌舞昇平眷眾樂\n悅心喜宴年月聚 一時王者曲高歌\n大悲自性三寶尊 示解脫道觀自在\n於心虔誠作祈請 垂賜護念聽我歌\n今日廣大虛空中 諸佛菩提薩埵眾\n親見如雲海會聚 吉祥勝住任運成\n諸淨梵天以妙樂 悉出無盡勝妙音\n普降曼達妙華雨 吉祥勝住任運成\n豎立如來正法幢 戰勝暗黑諸方所\n以此伏魔威德力 吉祥勝住任運成\n擊此聖教大法鼓 五毒愚癡自地息\n以此三寶法鼓音 吉祥勝住任運成\n喜悅之日冉冉昇 大樂之心難自抑\n所欲受用如雨降 吉祥勝住任運成\n本尊聖眾賜吉祥 松贊甘布成吉祥\n歌此吉祥勝妙曲 願吾眷屬皆吉祥\n如是歌此梵音已 普願人天皆歡喜`,
'點燈祈願文':`以此清淨光明之燈焰 獻供十方勝者與子嗣\n願能祛除眾生無明暗 般若本智光輝得開顯`,
'決心歌':`聖那洛巴子傳解脫道，加持窮子得山居；\n不為世間散亂擾，由定修觀得增長。\n安住無執三昧地，勝觀之花得綻放；\n不為熙攘戲論擾，離戲綠葉得增長。\n崖居一心無二意，修證之果得成熟；\n不為魔障所中斷，心之定解願得證。\n於方便道不生疑，父傳宗風子承繼；\n聖不動自性大悲者，加持窮子得山居。`,
'圓滿次第':`我修氣脈明點時 觀習四輪三主脈\n身內貪愛已盡故 身似無質自消融\n諸界淨為種子字 無礙持續明朗現\n見本來面無錯謬 氣集中脈擊要點\n紅白二界相遇合 樂明無念自成就\n心中疑結立解脫 法與心合離言說\n子母光明融一味 有漏貪熾蘊界滅\n顯空不二心樂然 證空不墮知解境\n現見空性心樂然 一切無明與迷亂\n消入廣境大樂哉`,
'一切顯相':`一切顯空不二顯相\n如同彩虹光彩閃亮\n在顯空離戲的廣境中 放下放鬆寬坦安住\n種種聲音聲空不二\n如同廻音繚繞不停\n在聲空離戲的廣境中 放下放鬆寬坦安住\n種種覺受樂空不二\n超越筆墨所能形容\n在樂空離戲的廣境中 放下放鬆寬坦安住\n一切覺空不二覺性\n超越概念所能明瞭\n在覺空離戲的廣境中 放下放鬆寬坦安住`,
'天龍甚深吼':`本淨無生法性虛空境 我見繽紛下方之世界\n細審查之無生亦無根 此即禪修無我實相時\n吾財受用悉如空中虹 無實無存甚至最微處\n當吾受用如幻之妙欲 顯空不二清茶與啤酒\n此即安住心之圓滿月 明空不二覺性本然時\n如來見修修持之次第 淨除世俗想法方便道\n以此訓練自己能熟練 顯相與心無基亦無根\n死亡疾病驟然降臨時 吾將準備妥當全無悔\n如網世間此生之顯相 父母親友悉皆如幻夢\n無常如霜原處消融時 即尋無生惑心實相時\n無基空之惑相輪迴中 吾因冷熱等等而受苦\n然若勤修威猛秘密乘 如狐怯懦自解時已至\n華衣妙飾四大此蘊聚 吾雖供養美食諸妙欲\n然此輕狂一生終了結 故應精勤令己無所懼\n面對無敵死神之審判 自彼雪山環繞之佛國\n吾已翻越千山與萬水 於此飛越虛空境之際\n清淨吾此如幻血肉身 化為顯空不二本尊身\n由此訓練自己能熟練 地道證悟任顯自解脫\n哈哈德謙讓卓無著行 啊伙翔於母親廣境中`,
'平等性之歌':`諸般顯相顯空平等性，一切音聲聲空平等性，\n諸般覺受樂空平等性，離念戲論平等性中住。\n遊歷城鎮亦如是行持，開放寬坦放鬆而自在，\n遠離一切戲論平等住。`,
'恆樂之歌':`敬禮馬爾巴足兮，眾生多苦祈加持。\n喂噫！黑麋鹿，頭生眾角枝，\n勿懼聽密勒，為汝歌此曲，\n汝因勤逃避，外境諸患故，\n內心無明生，種種顛倒相，無由得解脫。\n汝應息恐懼，莫執此肉身，身心齊放下，斷捨無明惑，淨除顛倒障，向道時至矣。\n執異熟為實，驚懼急躲竄，依此幻身逃，焉能得解脫？\n真實逃避處，內觀自心性，攝性歸菩提。\n除此無他途，能至解脫處。捨此而求他，是為真顛倒；應捨此迷謬，於此安然住！\n汝心現思維：死苦實難忍，若能逃彼山，則能得安穩，若身陷此山，終必被捕擒。\n一者為希望，一者為畏懼，由此希懼故，流轉於輪迴。\n我當開示汝，六種成就法，教汝大手印，觀心之法要。`,
'大手印之歌':`我修大手印觀時 心住本然離造作\n無散亂中鬆鬆住 空性境中明朗住\n喜樂境中明覺住 無分別中寬坦住\n眾緣境中平等住 此心如是安住已\n無滅決信種種生 自明任運事業成\n任何果報無需求 心離願求甚樂哉\n二執希懼盡除故 如是覺受甚樂哉\n一切迷惑與妄念 盡成智慧甚樂哉`,
'對勝義的三種確信':`敬禮譯師馬爾巴\n我於他鄉修行時 於無生法得定解\n今生來生二執淨 六道顯相成虛妄\n生死二者增益斷 於平等性得定解\n苦樂二執得清淨 感受體驗成虛妄\n取捨二者增益斷 於無分別得定解\n輪涅二執皆清淨 道地修習成虛妄\n希懼二者增益斷`,
'生起次第':`我觀生起本尊時 此身顯空似虹彩\n於此無有分別故 一切貪愛盡寂滅\n我修本尊瑜伽時 親證語言如谷響\n已超善惡境界故 一切取捨盡寂滅\n心即明光空性也 一如日月之光輝\n全無執念於其中 自我之念盡寂滅\n凡夫實質身口意 轉成本來金剛體\n三門已超凡界故 此心飄飄甚樂然\n所行與法相應故 此心欣欣甚樂然\n行法與道相應故 此心恰怡甚樂然`,
'樂空不二金剛舞':`啊拉拉伙\n顯空不二我之身 海市蜃樓水中影\n聲空不二我之語 一如幻光吉他曲\n本然自由我之心 海市蜃樓水上畫\n啊拉拉觀此三者 空無色相不思議\n眾所周知本尊相 實僅顯空不二也\n意欲無謬持咒音 實僅聲空不二也\n希求開悟之智慧 實僅覺空不二也\n啊拉拉且觀當下 色聲覺性之體驗\n噢瑜伽士瑜伽女 酣然薈供之明光\n且觀如是諸身形 何等曼妙且清明\n然離種種之分別 舞動樂空幻影舞\n啊拉拉且觀覺性 當下力量之展現\n噢瑜伽士瑜伽女 酣然甘露之離戲\n傾耳聆聽難言喻 難喻明空善妙曲\n明空紛現嬉戲貌 法性覺空之歡宴\n啊拉拉且觀覺性 其性靈動且燦然\n樂空覺空無分別 如是薈供吾獻供\n獻供大樂自解脫 成就聖眾之壇城\n於此法界離一切 聚散離合之虛空\n於此獻供祈加持 當下圓滿證樂空\n啊拉拉伙\n啊伙瑪哈蘇卡`,
'如幻三摩地詩偈':`聖集經\n知五蘊如幻 無異幻於蘊\n離想行寂靜 最勝智度行\n（佛陀所說）\n三摩地王經\n如幻作多身 謂男女象馬\n是相非真實 諸法亦復然\n（佛陀所說）\n中觀根本論頌\n如夢亦如幻 如乾闥婆城\n其相生住滅 所說亦是如是\n（龍樹菩薩作）\n入中論\n由於諸法見真妄 故得諸法二種體\n說見真境即真諦 所見虛妄名俗諦\n（月稱菩薩作）\n入菩薩行論\n眾生如夢幻 究時同芭蕉\n涅槃不涅槃 其性悉無別\n（寂天菩薩作）`,
'萬物本貌':`十方三世勝者與佛子 祈請慈愛看顧我等眾\n聚此修持具福之行者 止觀之道無謬聖道矣\n我等於此靜處禪修時 祈願此道生起於心續\n此生顯相猶如水中月 了知此即萬物本貌也\n尋覓離戲心性見地中 祈願確信堅固穩定也\n於此所得確信禪修時 祈願無惑體證盡展現\n以此力故我等作祈願 勝者珍貴教法遍宇宙\n高舉教法正夫恆住世 佛行事業無遠弗屆也`
};

let day=1,filter=0;
const el=id=>document.getElementById(id);const key=a=>a[1];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderDays(){el('days').innerHTML=[1,2,3].map(x=>`<button class="${x===day?'on':''}" onclick="day=${x};filter=0;render()">Day ${x}</button>`).join('')}
function renderSessions(){let ss=[...new Set(D.filter(x=>x[0]===day).map(x=>x[1]))];el('sessions').innerHTML=`<button class="${filter===0?'on':''}" onclick="filter=0;render()">全部 Session</button>`+ss.map(s=>`<button class="${filter===s?'on':''}" onclick="filter=${s};render()">Session ${s===1.5?'1（備選）':s}</button>`).join('')}
function item(a){let cn=a[1],en=a[0],pg=a[2],audio=A[cn],has=L[cn];return `<button class="song" onclick="openSong(${JSON.stringify(cn)},${JSON.stringify(en)},${JSON.stringify(pg)})"><div class="en">${esc(en)}</div><div class="cn">${esc(cn)}</div><div class="meta">📖 p.${esc(pg)}　${audio?'<span class="audio">🎧 有音檔</span>':'<span class="noaudio">🎧 尚無音檔</span>'}${has?'　<span class="chant">📜 有歌詞</span>':''}</div></button>`}
function render(){renderDays();renderSessions();let q=el('q').value.trim().toLowerCase();let rows=D.filter(x=>x[0]===day&&(filter===0||x[1]===filter));if(q)rows=D.filter(x=>x[0]===day&&x[2].toLowerCase().includes(q)||x[0]===day&&x[3].some(a=>a.join(' ').toLowerCase().includes(q)));if(!rows.length){el('app').innerHTML='<div class="notice">找不到符合的內容。</div>';return}el('app').innerHTML=`<div class="count">Day ${day} 共 ${rows.length} 個場次</div>`+rows.map(x=>`<section class="session"><div class="head"><b>Session ${x[1]===1.5?'1（備選）':x[1]}</b><span>${esc(x[2])}</span></div>${x[3].map(item).join('')}</section>`).join('')}
function openSong(cn,en,pg){let audio=A[cn],ly=L[cn]||'這個項目已依維那課表列入 App。歌詞請依上方頁碼查看法本；目前此頁沒有重複貼入文字。';el('app').innerHTML=`<div class="detail"><button class="back" onclick="render()">← 回 Day ${day} Session</button><h2>${esc(en)}</h2><div class="cn">${esc(cn)}</div><div class="page">法本 p.${esc(pg)}</div>${audio?`<div class="player"><small>🎧 音檔</small><audio controls preload="none" src="./${encodeURIComponent(audio).replace(/%2F/g,'/')}"></audio></div>`:'<div class="player"><small>🎧 尚無音檔</small>這首目前尚未上傳音檔，但仍保留在正確的維那場次。</div>'}<div class="sectiontitle">📖 歌詞／唱誦內容</div><div class="lyrics">${ly.split('\n').map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>`;window.scrollTo({top:0,behavior:'smooth'})}
el('q').addEventListener('input',render);render();</script></body></html>
