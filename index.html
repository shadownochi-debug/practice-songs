{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'The Five Poisons Self-Liberated',cn:'五毒自解脫',p:54,l:['莫隨瞋恨之對境，且觀瞋恨之自心，','瞋恨自生自解脫，即是明空之本性，','明空不二非其他，即是大圓鏡智也，','於彼瞋恨自解中，念誦六字大明咒。','嗡嘛呢唄咩吽（四遍）','莫執傲慢之對境，且觀執取之自心，','執取自身最殊勝，自生自解本空性，','本空之性非其他，即是平等性智也，','於彼傲慢自解中，念誦六字大明咒。','嗡嘛呢唄咩吽（四遍）','莫執貪欲之對境，且觀執著之自心，','執著自生自解脫，即是樂空之本性，','樂空不二非其他，即是妙觀察智也，','於彼貪欲自解中，念誦六字大明咒。','嗡嘛呢唄咩吽（四遍）','莫迷嫉妒之對境，且觀細察之自心，','細察自生自解脫，即是智空之本性，','智空不二非其他，即是成所作智也，','於彼嫉妒自解中，念誦六字大明咒。','嗡嘛呢唄咩吽（四遍）','莫再誤解愚癡境，且觀愚癡之自身，','念頭自生自解脫，即是覺空之本性，','覺空不二非其他，即是法界體性智，','於彼愚癡自解中，念誦六字大明咒。','嗡嘛呢唄咩吽（四遍）']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Friends',cn:'朋友',p:56,l:['遠離貪著、充滿愛的瑜伽士與瑜伽女','朋友即是空相 猶如水中月','設若執以為實 徒令痛苦增','若知皆是空相 猶如水中月','如幻三昧增長 無執悲增長','無焦點見增長 離執修增長','遠離能作所作 行持將增長','一切奇蹟之中 最大之奇蹟','一切美妙之中 無上之美妙']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'King Songtsen Gampo’s Song of Auspiciousness',cn:'法王松贊甘布勝住開光吉祥文',p:57,l:['敷設廣大供養具 登壇城已持香華 合掌啟白諦實語','兩足能仁釋迦子 化身無數利群生 一切如來勝導師 十方諸佛賜吉祥','善巧大悲之續流 調伏成熟令解脫 聖者觀自在尊等 願諸菩薩賜吉祥','清淨無垢勝法教 以四攝事興正法 佛子善現尊者等 願聖長老賜吉祥','所有十方淨土中 三世一切諸如來 以及菩提薩埵等 願賜灌頂祈降臨','最勝化身法中王 妙演諦實力之時 諸佛本尊護法眾 如日光塵雲煙雨','遍滿諸佛所散華 佛子敷演菩薩行 梵天普降大華雨 天女妙獻諸供養','天樂於中出妙音 方所遍滿勝妙香 智慧薩埵滿虛空 與誓言尊無二住','諸天無量妙言辭 稱歎最勝法王已 於此最勝二殿堂 吉祥勝住任運成','照見萬法如鏡影 歌舞昇平眷眾樂 悅心喜宴年月聚 一時王者曲高歌','大悲自性三寶尊 示解脫道觀自在 於心虔誠作祈請 垂賜護念聽我歌','今日廣大虛空中 諸佛菩提薩埵眾 親見如雲海會聚 吉祥勝住任運成','諸淨梵天以妙樂 悉出無盡勝妙音 普降曼達妙華雨 吉祥勝住任運成','豎立如來正法幢 戰勝暗黑諸方所 以此伏魔威德力 吉祥勝住任運成','擊此聖教大法鼓 五毒愚癡自地息 以此三寶法鼓音 吉祥勝住任運成','喜悅之日冉冉昇 大樂之心難自抑 所欲受用如雨降 吉祥勝住任運成','本尊聖眾賜吉祥 松贊甘布成吉祥 歌此吉祥勝妙曲 願吾眷屬皆吉祥','如是歌此梵音已 普願人天皆歡喜']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Light Offering',cn:'點燈祈願文',p:63,l:['以此清淨光明之燈焰 獻供十方勝者與子嗣','願能祛除眾生無明暗 般若本智光輝得開顯']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Prayer of Solemn Commitment',cn:'決心歌',p:68,l:['聖那洛巴子傳解脫道，加持窮子得山居；','不為世間散亂擾，由定修觀得增長。','安住無執三昧地，勝觀之花得綻放；','不為熙攘戲論擾，離戲綠葉得增長。','崖居一心無二意，修證之果得成熟；','不為魔障所中斷，心之定解願得證。','於方便道不生疑，父傳宗風子承繼；','聖不動自性大悲者，加持窮子得山居。']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'The Sampannakrama Song',cn:'圓滿次第',p:69,l:['我修氣脈明點時 觀習四輪三主脈','身內貪愛已盡故 身似無質自消融','諸界淨為種子字 無礙持續明朗現','見本來面無錯謬 氣集中脈擊要點','紅白二界相遇合 樂明無念自成就','心中疑結立解脫 法與心合離言說','子母光明融一味 有漏貪熾蘊界滅','顯空不二心樂然 證空不墮知解境','現見空性心樂然 一切無明與迷亂','消入廣境大樂哉']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Self-Appearing Illusion (All These Forms)',cn:'一切顯相',p:70,l:['一切顯空不二顯相 如同彩虹光彩閃亮','在顯空離戲的廣境中 放下放鬆寬坦安住','種種聲音聲空不二 如同廻音繚繞不停','在聲空離戲的廣境中 放下放鬆寬坦安住','種種覺受樂空不二 超越筆墨所能形容','在樂空離戲的廣境中 放下放鬆寬坦安住','一切覺空不二覺性 超越概念所能明瞭','在覺空離戲的廣境中 放下放鬆寬坦安住']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Sky Dragon’s Profound Roar',cn:'天龍甚深吼',p:71,l:['本淨無生法性虛空境 我見繽紛下方之世界','細審查之無生亦無根 此即禪修無我實相時','吾財受用悉如空中虹 無實無存甚至最微處','當吾受用如幻之妙欲 顯空不二清茶與啤酒','此即安住心之圓滿月 明空不二覺性本然時','如來見修修持之次第 淨除世俗想法方便道','以此訓練自己能熟練 顯相與心無基亦無根','死亡疾病驟然降臨時 吾將準備妥當全無悔','如網世間此生之顯相 父母親友悉皆如幻夢','無常如霜原處消融時 即尋無生惑心實相時','無基空之惑相輪迴中 吾因冷熱等等而受苦','然若勤修威猛秘密乘 如狐怯懦自解時已至','華衣妙飾四大此蘊聚 吾雖供養美食諸妙欲','然此輕狂一生終了結 故應精勤令己無所懼','面對無敵死神之審判','自彼雪山環繞之佛國 吾已翻越千山與萬水','於此飛越虛空境之際 清淨吾此如幻血肉身','化為顯空不二本尊身 由此訓練自己能熟練','地道證悟任顯自解脫','哈哈德謙讓卓無著行 啊伙翔於母親廣境中']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'The Song of Everlasting Happiness',cn:'恆樂之歌',p:74,l:['敬禮馬爾巴足兮，眾生多苦祈加持。','喂噫！黑麋鹿，頭生眾角枝，勿懼聽密勒，為汝歌此曲，汝因勤逃避，外境諸患故，內心無明生，種種顛倒相，無由得解脫。','汝應息恐懼，莫執此肉身，身心齊放下，斷捨無明惑，淨除顛倒障，向道時至矣。','執異熟為實，驚懼急躲竄，依此幻身逃，焉能得解脫？真實逃避處，內觀自心性，攝性歸菩提。','除此無他途，能至解脫處。捨此而求他，是為真顛倒；應捨此迷謬，於此安然住！','汝心現思維：死苦實難忍，若能逃彼山，則能得安穩，若身陷此山，終必被捕擒。','一者為希望，一者為畏懼，由此希懼故，流轉於輪迴。','我當開示汝，六種成就法，教汝大手印，觀心之法要。']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Song of Mahamudra',cn:'大手印之歌',p:76,l:['我修大手印觀時 心住本然離造作','無散亂中鬆鬆住 空性境中明朗住','喜樂境中明覺住 無分別中寬坦住','眾緣境中平等住 此心如是安住已','無滅決信種種生 自明任運事業成','任何果報無需求 心離願求甚樂哉','二執希懼盡除故 如是覺受甚樂哉','一切迷惑與妄念 盡成智慧甚樂哉']},
{sec:'六、共修選唱道歌｜Dohas / Songs of Realization',en:'Three Kinds of Confidence in Genuine Reality',cn:'對勝義的三種確信',p:77,a:'23_對勝義的三種確信.mp3',l:['敬禮譯師馬爾巴','我於他鄉修行時 於無生法得定解','今生來生二執淨 生死二者增益斷','於平等性得定解 苦樂二執得清淨','感受體驗成虛妄 取捨二者增益斷','於無分別得定解 輪涅二執皆清淨','道地修習成虛妄 希懼二者增益斷']},

let current=-1,page=0;const main=document.getElementById('main');const player=document.createElement('audio');player.controls=true;player.preload='metadata';
function home(){current=-1;page=0;main.innerHTML='<p class="intro">歌曲列表 → 歌詞 → 音檔。已有音檔的歌曲可以直接播放，沒有音檔的歌曲仍可閱讀歌詞。</p>'+[...new Set(songs.map(s=>s.sec))].map(sec=>'<div class="section">'+sec+'</div>'+songs.map((s,i)=>[s,i]).filter(x=>x[0].sec===sec).map(([s,i])=>'<button class="song" onclick="openSong('+i+')"><strong>'+s.en+'</strong><span>'+s.cn+'</span><em>法本 p.'+s.p+(s.a?'｜已有音檔':'｜尚未加入音檔')+'</em></button>').join('')).join('')}
function openSong(i){current=i;page=0;render()}
function render(){const s=songs[current],lines=s.l||[],per=4,total=Math.max(1,Math.ceil(lines.length/per));if(s.a){player.src='https://raw.githubusercontent.com/shadownochi-debug/practice-songs/main/'+s.a.split('/').map(encodeURIComponent).join('/');player.load()}else{player.pause();player.removeAttribute('src');player.load()}const shown=lines.slice(page*per,(page+1)*per);main.innerHTML='<button class="back" onclick="home()">← 回歌曲列表</button><h2 class="page-title">'+s.en+'</h2><div class="page-subtitle">'+s.cn+'｜法本 p.'+s.p+'</div>'+(s.a?'<div class="audio-card"><div class="audio-label">🎵 音檔</div><div id="audioSlot"></div></div>':'<div class="audio-card"><div class="audio-label">🎵 音檔尚未加入</div></div>')+'<section class="lyrics"><div class="heading">'+s.en+'<br>'+s.cn+'</div>'+ (shown.length?shown.map(x=>'<p class="line">'+x+'</p>').join(''):'<p class="line" style="text-align:center;color:var(--muted)">歌詞尚未加入</p>')+'</section>'+(total>1?'<div class="navrow"><button class="nav" '+(page===0?'disabled':'')+' onclick="changePage(-1)">← 上一頁</button><button class="nav next" '+(page===total-1?'disabled':'')+' onclick="changePage(1)">下一頁 →</button></div><div class="count">第 '+(page+1)+' / '+total+' 頁</div>':'');if(s.a)document.getElementById('audioSlot').appendChild(player);window.scrollTo(0,0)}
function changePage(n){const total=Math.max(1,Math.ceil((songs[current].l||[]).length/4));page=Math.max(0,Math.min(total-1,page+n));render()}home();
</script></body></html>
