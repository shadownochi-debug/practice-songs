<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道歌與祈請文修持">
<title>道歌與祈請文修持</title>
<style>
:root{--bg:#f4efe6;--paper:#fffdf8;--ink:#302a24;--muted:#81766a;--line:#ddd2c3;--accent:#6e5842}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
button{font:inherit;cursor:pointer}.app{max-width:680px;min-height:100vh;margin:auto}
header{padding:28px 18px 18px;text-align:center}h1{margin:0;font-size:27px;letter-spacing:.12em;font-weight:600}
.sub{margin-top:7px;color:var(--muted);font-size:13px}.back{border:0;background:transparent;color:var(--accent);padding:3px 2px 15px}
.page-title{font-size:22px;font-weight:600;line-height:1.45;margin:0 0 14px}.audio-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:12px}
.audio-label{font-size:13px;color:var(--muted);margin-bottom:7px}.audio-card audio{width:100%;height:40px}
.lyrics{background:var(--paper);border:1px solid var(--line);border-radius:17px;min-height:58vh;padding:28px 21px;display:flex;flex-direction:column;justify-content:center}
.lyrics.one-page{min-height:0}.heading{font-size:15px;font-weight:600;color:var(--accent);line-height:1.5;margin:0 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.line{font-size:20px;line-height:1.95;letter-spacing:.02em;margin:0 0 9px;overflow-wrap:anywhere}.small .line{font-size:19px;line-height:1.72;margin-bottom:7px}
.navrow{display:flex;gap:10px;margin-top:14px}.nav{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:11px;padding:14px}.next{background:var(--accent);color:#fff;border-color:var(--accent)}.nav:disabled{opacity:.3}
.count{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.note{font-size:13px;color:var(--muted);line-height:1.7;margin:12px 3px}.noaudio{font-size:12px;color:var(--muted);margin-top:6px}
.section{margin:16px 4px 10px;color:var(--muted);font-size:13px;letter-spacing:.12em}.song{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 16px;margin-bottom:10px;color:var(--ink);box-shadow:0 2px 8px #00000005}
.song strong{display:block;font-size:18px;line-height:1.45;margin-bottom:5px}.song span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
@media(max-width:420px){.line{font-size:19px}.lyrics{padding:24px 17px}.page-title{font-size:20px}.small .line{font-size:18px;line-height:1.68;margin-bottom:6px}}
</style>
</head>
<body>
<div class="app"><header><h1>道歌與祈請文修持</h1><div class="sub">中文歌偈練習</div></header><main id="main"></main></div>
<script>
const songs=[];
function home(){currentSong=null;main.innerHTML='<div class="section">歌曲練習</div><p class="note">請從歌曲列表選擇練習內容。</p>'}
let currentSong=null,currentPage=0,currentAudioFile=null;const main=document.getElementById('main');const player=document.createElement('audio');player.controls=true;player.preload='metadata';player.style.width='100%';home();
</script>
</body>
</html>
