[S.F,'Auspiciousness That Lights Up the Universe','吉祥光照全宇宙',47,'吉祥光照全宇宙.mp3',['Namo Guru Hasa Vajra Ye','（頂禮上師喜笑金剛）','親見輪涅萬法僅緣起 且見緣起心要即法性','以此力故祥光照宇宙 喜笑金剛屹立我心中','了知根之實相離概念 且知緣起顯相如水月','以此盡除邪見與疑黯 祈願吉祥光照全宇宙','智慧照見萬法真實義 如母愛子利樂有情眾','威力轉化仇敵為弟子 祈願吉祥光照全宇宙','輪迴之因我執最勝藥 即是了知無我正法故','以息眾生我執迷惑力 祈願吉祥光照全宇宙','已然捨離凡夫世間法 了知勝義實相之聖眾','引導凡夫入於寂滅道 祈願吉祥光照全宇宙','賜予二種成就之本尊 與除惡緣障礙護法神','盡除道上一切之違緣 祈願吉祥光照全宇宙','以此世界一切之方所 無害寂靜善道盛行力','關愛之心相互深連結 祈願吉祥光照全宇宙','願此極盛豐饒之世紀 不生財富利益之紛擾','願享無爭無害之妙欲 祈願吉祥光照全宇宙','願此科學極盛之世紀 如同天人受用之機器','悉成無害和平勝方便 祈願吉祥光照全宇宙','祈願外在物質之科學 結合內在心靈之科學','以此善息心之謬誤力 祈願吉祥光照全宇宙','如是吉祥之光所生源 即是光明心之本質故','心之本質如是了知已 善妙祥光何等燦爛也','願此吉祥之光燦然處 皆以慈悲最勝菩提心','生起自他二者平等心 祈願善妙祥光不減損']],

function home(){currentSong=null;main.innerHTML='<p class="intro">依 2026 尼泊爾共修維那領唱曲目中英對照清單整理，共 32 首。英文歌名優先，並附中文曲名與法本頁碼。</p>'+[...new Set(data.map(s=>s.section))].map(sec=>'<div class="section">'+sec+'</div>'+data.filter(s=>s.section===sec).map(s=>`<button class="song" onclick="openSong(${s.i})"><strong>${s.title}</strong><span>${s.cn}</span><em>法本 p.${s.page}${s.audio?'｜已有音檔':'｜音檔尚未加入'}</em></button>`).join('')).join('')}
function openSong(i){currentSong=i;currentPage=0;const s=data[i];if(s.audio){const src='https://raw.githubusercontent.com/shadownochi-debug/practice-songs/main/'+encodeURIComponent(s.audio);if(currentAudioFile!==src){player.pause();player.src=src;player.load();currentAudioFile=src}}else{player.pause();currentAudioFile=null;player.removeAttribute('src');player.load()}renderSong()}
function renderSong(){const s=data[currentSong];const n=s.lines.length?4:0;const pages=n?Array.from({length:Math.ceil(s.lines.length/n)},(_,j)=>s.lines.slice(j*n,(j+1)*n)):[];const lines=pages[currentPage]||[];const audio=s.audio?'<div class="audio-card"><div class="audio-label">🎵 '+s.title+'</div><div id="audioSlot"></div></div>':'<div class="audio-card"><div class="audio-label">🎵 音檔尚未加入</div><div class="noaudio">之後加入音檔即可直接播放。</div></div>';const nav=pages.length>1?'<div class="navrow"><button class="nav" '+(currentPage===0?'disabled':'')+' onclick="changePage(-1)">← 上一頁</button><button class="nav next" '+(currentPage===pages.length-1?'disabled':'')+' onclick="changePage(1)">下一頁 →</button></div><div class="count">第 '+(currentPage+1)+' / '+pages.length+' 頁</div>':'';const body=pages.length?lines.map(x=>'<p class="line">'+x+'</p>').join(''):'<p class="line" style="text-align:center;color:var(--muted);font-size:16px">歌詞尚未加入</p>';main.innerHTML='<button class="back" onclick="home()">← 回歌曲列表</button><h2 class="page-title">'+s.title+'</h2><div class="page-subtitle">'+s.cn+'｜法本 p.'+s.page+'</div>'+audio+'<section class="lyrics"><div class="heading">'+s.title+'<br>'+s.cn+'</div>'+body+'</section>'+nav;if(s.audio)document.getElementById('audioSlot').appendChild(player);window.scrollTo({top:0,behavior:'smooth'})}
function changePage(n){currentPage=Math.max(0,Math.min(99,currentPage+n));renderSong()}home();
</script></body></html>
