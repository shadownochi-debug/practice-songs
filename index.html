<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="祈請文修持"><title>祈請文修持</title><style>:root{--bg:#f4efe6;--paper:#fffdf8;--ink:#302a24;--muted:#81766a;--line:#ddd2c3;--accent:#6e5842}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}button{font:inherit;cursor:pointer}.app{max-width:680px;min-height:100vh;margin:auto}header{padding:28px 18px 18px;text-align:center}h1{margin:0;font-size:27px;letter-spacing:.12em;font-weight:600}.sub{margin-top:7px;color:var(--muted);font-size:13px}main{padding:0 14px 130px}.section{margin:16px 4px 10px;color:var(--muted);font-size:13px;letter-spacing:.12em}.song{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 16px;margin-bottom:10px;color:var(--ink);box-shadow:0 2px 8px #00000005}.song strong{display:block;font-size:18px;line-height:1.45;margin-bottom:5px}.song span{display:block;font-size:13px;color:var(--muted);line-height:1.5}.back{border:0;background:transparent;color:var(--accent);padding:3px 2px 15px}.page-title{font-size:22px;font-weight:600;line-height:1.45;margin:0 0 14px}.audio-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:12px}.audio-label{font-size:13px;color:var(--muted);margin-bottom:7px}.audio-card audio{width:100%;height:40px}.lyrics{background:var(--paper);border:1px solid var(--line);border-radius:17px;min-height:58vh;padding:28px 21px;display:flex;flex-direction:column;justify-content:center}.heading{font-size:15px;font-weight:600;color:var(--accent);line-height:1.5;margin:0 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line)}.line{font-size:20px;line-height:1.95;letter-spacing:.02em;margin:0 0 9px;overflow-wrap:anywhere}.navrow{display:flex;gap:10px;margin-top:14px}.nav{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:11px;padding:14px}.next{background:var(--accent);color:#fff;border-color:var(--accent)}.nav:disabled{opacity:.3}.count{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.note{font-size:13px;color:var(--muted);line-height:1.7;margin:12px 3px}.noaudio{font-size:12px;color:var(--muted);margin-top:6px}@media(max-width:420px){.line{font-size:19px}.lyrics{padding:24px 17px}.page-title{font-size:20px}}</style></head><body><div class="app"><header><h1>祈請文修持</h1><div class="sub">中文歌偈練習</div></header><main id="main"></main></div><script>
const songs=[
{id:'tara',title:'白度母祈請文',subtitle:'白度母祈請文',audio:'白度母祈請文.m4a',pageSize:6,lines:['眾生皆為執實念所苦 祈爾無我智眼視眾生','三界輪迴之苦除滅者 度母如意輪寶除死懼','祈賜無上共通之悉地','嗡達咧 嘟達咧 嘟咧 梭哈','嗡達咧 嘟達咧 嘟咧 瑪瑪 阿優 布涅','嘉納 布真咕嚕 梭哈']},
{id:'karmapa',title:'第十七世法王噶瑪巴長久住世祈請文',subtitle:'祈請文',audio:'第十七世大寶法王鄔金欽列多傑長壽祈請文.mp4',lines:['第二佛陀鄔金海生尊　三密門之佛業攝一舞','諸佛之主蓮足願常固　如海經劫常駐金剛界']},
{id:'rebirth',title:'勸請至要誓願',subtitle:'堪千竹清嘉措仁波切迅速轉世祈請文',audio:'勸請至要誓願 堪千竹清嘉措仁波切迅速轉世祈請文.mp3',lines:['嗡梭諦','遍主本初依怙金剛持 根傳持明上師諸聖眾','速勇度母等殊勝本尊 具誓護法祈賜真加持','密嚴淨土教主金剛持 此時示現人道之色身','一切苦痛眾生之依怙 由法界中利生祈降臨','乃至虛空壇城未盡時 慈憫一切眾生三摩地','法界無有中邊恆相擁 事業恆無間斷願熾盛','三根本及天女加持力 吾等信心悲切而祈請','化身月容再現而盈滿 重現教眾安樂之光明']},
{id:'rain',title:'加持雨降任顯豁然曲',subtitle:'上師祈請文',audio:'加持雨降任顯豁然曲上師祈請文.m4a',lines:['南無咕嚕','客塵清淨自生之本智 離於破立取捨光殼中','身智本然法性之上師 自識本貌性中作祈請','大空命之明點耀攝舞 和合相好韶華明朗現','嘿嚕嘎尊報身之上師 心氣無二性中作祈請','三匯處之熾燃拙火舌 無餘焚毀蘊執為塵埃','燃滴融於中脈上師尊 溶樂俱生性中作祈請','顯聲覺於上師舞中現 悲智雄力加持住自心','四灌密意心意相融已 祈賜二利任運之加持']},
{id:'flute',title:'天笛之哀呼',subtitle:'十萬賢哲之頂嚴堪千竹清喜措仁波切祈請文',audio:'天笛之哀呼 萬賢哲之頂嚴堪千竹清喜措仁波切祈請文.m4a',lines:['南無咕嚕班扎達惹雅（敬禮上師金剛持）','智慧多聞深解經咒義 圓證深教明睿廣通達','事業浩瀚教眾之榮光 具格賢善知識護念我','心意無漏交輝如雲鬘 融於無遮法身之天際','色身示現日落而西沉 我心難忍哀呼上師尊','戒律圓淨藏紅法袍嚴 無逸禪定全大勇觀行','寶有全知燦爛知識海 痛切祈請無比之上師','講辯著作宣經續密意 內住等持證悟登王座','托舉解行大日具力者 教證佛法棟樑尊恆念','氣脈明點中脈和合中 三顯次第消融四空舞','幻身虹彩明光大樂身 呼喚雙運自解尊勝師','無緣空性離戲之法界 真如不壞俱生大本智','無別無漏密意虛空中 祈賜加持甘露潤我心']},
{id:'devotion',title:'殷切虔敬曲',subtitle:'大恩上師祈請文',audio:'殷切虔敬曲 大恩上師祈請文.m4a',lines:['上師知 上師知 上師知','當下心性有如虛空時 我父大恩上師之法身','真實佛陀德謙讓卓知 祈賜心意合一之悉地','當下顯相無非明光時 我父大恩上師報身圓','真實佛陀德謙讓卓知 祈賜心意雙運之悉地','當下心顯皆為遊戲時 我父大恩上師之化身','真實佛陀德謙讓卓知 祈賜心意不離之悉地','勝義上師尊之大悲藏 常住我虔敬心永不離','我此自心一如上師般 祈賜加持當下即了悟','從來無聚無散虔敬中 自心若能無疑作祈請','大愛悲心不倦恆看護 賜與師心無別之悉地']},
{id:'diyabuchen',title:'諦雅竹奔仁波切長久住世祈請文',subtitle:'祈請文｜目前先放歌詞',audio:null,lines:['為教為眾清淨勝意樂 不動聰慧執持妙事蹟','噶瑪賢遍羅卓仁波切 蓮足永固事業恆昌盛','如於前世祈願所發心 究竟厭離清淨出離心','正法修持穩固如高山 精要教法持者願吉祥','不虛殊勝三寶皈依處 無死壽尊加持真諦力','我等虔信意樂眾善力 所願如是任運願成辦']}
];
for(const s of songs){const n=s.pageSize||4;s.pages=Array.from({length:Math.ceil(s.lines.length/n)},(_,i)=>s.lines.slice(i*n,(i+1)*n))}let currentSong=null,currentPage=0,currentAudioFile=null;const main=document.getElementById('main');const player=document.createElement('audio');player.controls=true;player.preload='metadata';player.style.width='100%';function home(){currentSong=null;main.innerHTML='<div class="section">歌曲練習</div>'+songs.map((s,i)=>`<button class="song" onclick="openSong(${i})"><strong>${s.title}</strong><span>${s.subtitle}</span></button>`).join('')+'<p class="note">每頁約四句，翻頁時音檔會繼續播放。白度母祈請文完整六句顯示於同一頁；諦雅竹奔仁波切長久住世祈請文目前先放歌詞。</p>'}function openSong(i){currentSong=i;currentPage=0;const s=songs[i];if(s.audio){const src='https://raw.githubusercontent.com/shadownochi-debug/practice-songs/main/'+encodeURIComponent(s.audio).replace(/%20/g,'%20');if(currentAudioFile!==src){player.pause();player.src=src;player.load();currentAudioFile=src}}else{player.pause();currentAudioFile=null;player.removeAttribute('src');player.load()}renderSong()}function renderSong(){const s=songs[currentSong],lines=s.pages[currentPage];let audio=s.audio?'<div class="audio-card"><div class="audio-label">🎵 '+s.title+'</div><div id="audioSlot"></div></div>':'<div class="audio-card"><div class="audio-label">🎵 音檔尚未加入</div><div class="noaudio">這首先練歌詞，之後有音檔再加入即可。</div></div>';main.innerHTML='<button class="back" onclick="home()">← 回歌曲列表</button><h2 class="page-title">'+s.title+'</h2>'+audio+'<section class="lyrics"><div class="heading">'+s.subtitle+'</div>'+lines.map(x=>'<p class="line">'+x+'</p>').join('')+'</section><div class="navrow"><button class="nav" '+(currentPage===0?'disabled':'')+' onclick="changePage(-1)">← 上一頁</button><button class="nav next" '+(currentPage===s.pages.length-1?'disabled':'')+' onclick="changePage(1)">下一頁 →</button></div><div class="count">第 '+(currentPage+1)+' / '+s.pages.length+' 頁</div>';if(s.audio)document.getElementById('audioSlot').appendChild(player);window.scrollTo({top:0,behavior:'smooth'})}function changePage(n){currentPage=Math.max(0,Math.min(songs[currentSong].pages.length-1,currentPage+n));renderSong()}home();</script></body></html>
