const songs=[{"sec":"一、共修基礎儀軌","en":"Refuge in Sanskrit","cn":"梵文三皈依","p":7,"a":null,"l":["Namas Tasmai Bhagavate Arhate","Samyak Sambuddhāya","Buddhaṃ Śaraṇaṃ Gacchāmi","Dharmaṃ Śaraṇaṃ Gacchāmi","Saṅghaṃ Śaraṇaṃ Gacchāmi","Dvitīyaṃ Api","Buddhaṃ Śaraṇaṃ Gacchāmi","Dharmaṃ Śaraṇaṃ Gacchāmi","Saṅghaṃ Śaraṇaṃ Gacchāmi","Tṛtīyaṃ Api","Buddhaṃ Śaraṇaṃ Gacchāmi","Dharmaṃ Śaraṇaṃ Gacchāmi","Saṅghaṃ Śaraṇaṃ Gacchāmi"]},{"sec":"一、共修基礎儀軌","en":"Refuge and Bodhicitta","cn":"皈依發心","p":7,"a":null,"l":["諸佛正法聖僧眾 直至菩提我皈依","以我布施等功德 為利眾生願成佛","（三遍）"]},{"sec":"一、共修基礎儀軌","en":"Aspiration to Generate Bodhicitta","cn":"發菩提心願文","p":8,"a":null,"l":["如昔諸善逝 先發菩提心","復次循序住 菩薩諸學處","如是為利生 我發菩提心","復於諸學處 次第勤修學","（三遍）"]},{"sec":"一、共修基礎儀軌","en":"Four Immeasurables","cn":"四無量心","p":8,"a":null,"l":["願一切有情具樂及樂因，","願一切有情離苦及苦因，","願一切有情具喜及喜因，","願一切有情，遠離怨親愛憎，","常住大平等捨。","（三遍）"]},{"sec":"一、共修基礎儀軌","en":"Supplication to the Takpo Kagyu","cn":"大手印傳承祈請文","p":9,"a":"4_大手印傳承祈請文(後段重複旋律).m4a","l":["金剛總持帝洛那洛巴 瑪巴密勒法王岡波巴","普明三世遍知噶瑪巴 四大八小傳承持有者","止達察派具德竹巴等 於甚深道大印得自在","達波噶舉無比眾生怙 於諸口傳上師作祈請","持有傳承記述祈加持","教云離欲即為修行足 於諸飲食財寶無繫念","斷離此生貪網之行者 無著名聞利養祈加持","教云虔敬即為修行首 上師開啟口訣寶藏門","於諸恆常祈請之行者 加持生起無偽之虔敬","教云無逸即是修正行 妄念隨顯體性自鮮明","住於任運無整之行者 離於禪修之念祈加持","教云妄念體性即法身 所顯非真宛然而顯現","不滅幻有顯現之行者 證悟輪涅無二祈加持","世世不離清淨上師尊 受用殊勝吉祥之法教","五道十地功德悉圓滿 願速證得金剛持果位"]},{"sec":"一、共修基礎儀軌","en":"Seven-Branch Offering Prayer","cn":"七支供養祈請文","p":10,"a":null,"l":["所有十方世界中 三世一切人師子","我以清淨身語意 一切遍禮盡無餘","普賢行願威神力 普現一切如來前","一身復現剎塵身 一一遍禮剎塵佛","於一塵中塵數佛 各處菩薩眾會中","無盡法界塵亦然 深信諸佛皆充滿","各以一切音聲海 普出無盡妙言辭","盡於未來一切劫 讚佛甚深功德海","以諸最勝妙華鬘 伎樂塗香及傘蓋","如是最勝莊嚴具 我以供養諸如來","最勝衣服最勝香 末香燒香與燈燭","一一皆如妙高聚 我悉供養諸如來","我以廣大勝解心 深信一切三世佛","悉以普賢行願力 普遍供養諸如來","我昔所造諸惡業 皆由無始貪恚癡","從身語意之所生 一切我今皆懺悔","十方一切諸眾生 二乘有學及無學","一切如來與菩薩 所有功德皆隨喜","十方所有世間燈 最初成就菩提者","我今一切皆勸請 轉於無上妙法輪","諸佛若欲示涅槃 我悉至誠而勸請","唯願久住剎塵劫 利樂一切諸眾生","所有禮讚供養福 請佛住世轉法輪","隨喜懺悔諸善根 迴向眾生及佛道"]},{"sec":"一、共修基礎儀軌","en":"Mandala Offering","cn":"獻曼達","p":11,"a":null,"l":["大地塗香敷妙花 須彌四洲日月嚴","觀為佛國作供獻 有情咸受清淨剎"]},{"sec":"一、共修基礎儀軌","en":"Requesting the Turning of the Dharma Wheel","cn":"請轉法輪","p":11,"a":null,"l":["隨諸有情一切願 宜其種種差別智","應其大小通常類 勸轉一切妙法輪"]},{"sec":"二、度母修持","en":"Tara Supplication","cn":"度母頌","p":12,"a":null,"l":["聖解脫者度母眷屬眾 往昔摯愛誓言請憶持","掃除我及有情之恐懼 淨除疾病礙魔與逆緣","促使順緣圓滿而昌盛 世俗無上悉地請賜予","嗡達咧 嘟達咧 嘟咧 梭哈（四遍）"]},{"sec":"二、度母修持","en":"Supplication to White Tara","cn":"白度母祈請文","p":12,"a":"白度母祈請文.m4a","l":["眾生皆為執實念所苦 祈爾無我智眼視眾生","三界輪迴之苦除滅者 度母如意輪寶除死懼","祈賜無上共通之悉地","嗡達咧 嘟達咧 嘟咧 梭哈","嗡達咧 嘟達咧 嘟咧 瑪瑪 阿優 布涅","嘉納 布真咕嚕 梭哈"]},{"sec":"二、度母修持","en":"Tara Visualization Verse","cn":"度母本尊修持","p":13,"a":null,"l":["我身即聖度母顯空相 諸音聲空自然之咒音","心即明空度母證悟心 心即明空聖度母之心","以此光耀歌舞三昧力 我將饒益不同有情眾","願予眾生快樂與歡喜 願予眾生快樂與歡喜","嗡達咧 嘟達咧 嘟咧 梭哈（三遍）"]},{"sec":"二、度母修持","en":"21 Praises to Arya Tara","cn":"聖救度佛母二十一種禮讚經","p":14,"a":null,"l":["唵敬禮尊聖救度母","敬禮多哩速疾勇 咄多哩者除怖畏","咄哩能授諸勝義 具莎訶字我讚禮","敬禮救度速勇母 目如剎那電光照","三世界尊蓮華面 從妙華中現端嚴","敬禮百秋朗月母 普遍圓照無垢面","如千星宿俱時聚 殊勝威光超於彼","敬禮紫磨金色母 妙蓮華手勝莊嚴","施精勤行柔善靜 忍辱禪定性無境","敬禮如來頂髻母 最勝能滿無邊行","得到彼岸盡無餘 勝勢佛子極所愛","敬禮怛囉吽字母 聲愛方所滿虛空","運足遍履七世界 悉能鉤召攝無餘","敬禮釋梵火天母 風神自在眾俱集","部多起屍尋香等 諸藥叉眾作稱歎","敬禮特囉胝發母 於他加行極摧壞","展左踡右作足踏 頂髻熾盛極明耀","敬禮都哩大緊母 勇猛能摧怨魔類","於蓮華面作顰眉 摧壞一切冤家眾","敬禮三寶嚴印母 手指當心威嚴相","嚴飾方輪盡無餘 自身熾盛光聚種","敬禮威德歡悅母 寶光珠蔓眾光飾","最極喜笑睹怛哩 鎮世間魔作攝伏","敬禮守護眾地母 亦能鉤召諸神眾","搖顰眉面吽聲字 一切衰敗令度脫","敬禮頂冠月相母 冠中現勝妙嚴光","阿彌陀佛髻中現 常放眾妙寶光明","敬禮如盡劫火母 安住熾盛頂髻中","普遍喜悅半趺坐 能摧滅壞惡冤輪","敬禮手按大地母 以足踐蹋作鎮壓","現顰眉面作吽聲 能破七險鎮降伏","敬禮安穩柔善母 涅槃寂滅最樂境","莎訶命種以相應 善能消滅大災禍","敬禮普遍極喜母 諸怨支體令脫離","十字咒句妙嚴布 明咒吽聲常朗耀","敬禮都哩巴帝母 足躡相勢吽字種","彌嚕曼陀結辣薩 於此三處能搖動","敬禮薩囉天海母 手中執住神獸像","誦二怛囉作發聲 能滅諸毒盡無餘","敬禮諸天集會母 天緊那羅所依愛","威德歡悅若堅鎧 滅除鬥諍及惡夢","敬禮日月廣圓母 目睹猶勝普光照","誦二喝囉咄怛哩 善除惡毒瘟熱病","敬禮具三真實母 善靜威力皆具足","藥叉執魅尾怛辣 都哩最極除災禍","若有智者勤精進 至心誦此二十一"]},{"sec":"三、上師相應與蓮師","en":"Guru Yoga by Dechen Rangdrol","cn":"德謙讓卓上師相應法","p":17,"a":"24_德謙讓卓上師相應法.m4a","l":["諸顯相顯空不二 即是上師證悟身","諸音響聲空不二 即是上師證悟語","想法記憶皆明空 即是上師證悟心","遠離成阻之上師 上師祈請鑑知我","平等性之上師尊 上師祈請鑑知我","顯空不二如彩虹 如是色相赤裸觀","聲空不二如迴音 如是聲音凝神聽","明空不二難言喻 心之自性如是見","無執自在於本然 寬坦鬆緩啊啊啊"]},{"sec":"三、上師相應與蓮師","en":"A Short Guruyoga of Khenpo Tsültrim Gyamtso Rinpoche","cn":"金剛持堪千竹清嘉措仁波切上師相應法","p":18,"a":"金剛持堪千竹清嘉措仁波切 上師相應法.m4a","l":["自頂獅座蓮花上 日月墊上眾部主","具德上師金剛持 身如無雲晴空色","一面二臂具鈴杵 方便智慧之雙運","手印持於心間處 金剛跏趺姿而坐","悅麗嚴飾衣裝具 思前對心積淨者","為主並置諸有情","密嚴法界之宮殿 三時諸佛之體性","明示自心即法身 頂禮具德聖上師","身語受用意化現 獻諸供養並禮讚","懺悔往昔諸罪障 往後不復更造罪","隨喜一切有情善 迴向最勝菩提因","祈不入涅恆住世 啟轉無上勝乘法","無方熟稔慈與悲 勝義俱生之本智","如佛菩薩之證悟 加被吾現前了悟","供養曼達","大地塗香敷妙花 須彌四洲日月嚴","觀為佛國作供獻 有情咸受清淨剎","嗡 曼扎 布紮梅嘎 薩母扎 薩帕惹那 薩嘛耶 啊吽","祈請文","上師仁波切 實義傳承者","聖化之傳遷者 證悟定量者","具神通與五眼 神變嚴置教示","賜難承受大恩 執手交付佛果","轉化凡夫俗相 示現清淨廣大","聖者觀世自在 吾以徹骨深心","虔心悲切祈請 祈求慈悲攝受","成就雄銳力者 噶舉無可辯駁","調伏兇殘之力 無與倫比事業","圓滿淨妙佛陀 我以三門善根","為了無邊有情 唯此當下供養","大慈憫而納受 於一切有情中","恆救護之上師 由心賜與加持","能如師尊一般","噶瑪巴千諾"]},{"sec":"三、上師相應與蓮師","en":"Supplication for Self-Liberation of Thoughts","cn":"蓮師妄念自解脫祈請文","p":21,"a":null,"l":["顯現於眼所見一切相 內在外在一切之萬法","情器世間諸法雖顯現 令其安住遍尋無我處","所執色法悉皆淨化時 即本尊身明空不二也","貪欲已自解脫之上師 鄔金貝瑪炯內我祈請","顯現於耳所聞一切音 執取諸音悅意不悅意","令其安住聲空不二境 離一切念超越諸想像","諸音空性無生亦無滅 如是即成勝利者教法","勝者教法聲空不二也 鄔金貝瑪炯內我祈請","心隨境轉一切之移動 諸念孳生五毒與煩惱","令諸念心無造作安住 莫思往昔莫臆測未來","若令驛動安住於原處 一切驛動解脫入法身","覺性已自解脫之上師 鄔金貝瑪炯內我祈請","祈請賜予加持令淨化 外在所攝對境之顯相","祈請賜予加持令解脫 內在心理運作能覺心","祈請加持能所二元間 明光將證本來之面目","三世一切善逝悲心中 祈請加持我心得解脫"]},{"sec":"三、上師相應與蓮師","en":"Guru Yoga with Feast Offering & Fulfillment Prayers","cn":"蓮師上師相應法 薈供與酬懺","p":23,"a":null,"l":["嗡 啊 吽","觀想自身顯現為本尊，而於面前廣大虛空中，","顯現三恩根本上師眾、皈境總集化身蓮花生、","與三根本諸本尊雲聚。"]},{"sec":"三、上師相應與蓮師","en":"Seven-Line Supplication to Guru Rinpoche","cn":"蓮師七句祈請文","p":24,"a":"26_蓮師七句祈請文（華老師 馬爾巴調）.m4a","l":["吽","HŪṂ","鄔金剎土西北隅，蓮花花莖胚芽上，","稀有殊勝妙成就，得大名稱蓮花生，","周圍空行眾圍繞，我隨本尊勤修持，","祈賜加持祈降臨，咕嚕貝瑪悉地吽。","（七遍）","嗡啊吽 班札咕嚕 貝瑪 悉地吽","OṂ ĀḤ HŪṂ VAJRA GURU PADMA SIDDHI HŪṂ"]},{"sec":"三、上師相應與蓮師","en":"Seven-Line Supplication + Guru Rinpoche Mantra","cn":"蓮師七句祈請文接續蓮師心咒","p":24,"a":"27_蓮師七句祈請文接續蓮師心咒.m4a","l":["嗡 啊 吽","OṂ ĀḤ HŪṂ","觀想自身顯現為本尊，而於面前廣大虛空中，","顯現三恩根本上師眾、皈境總集化身蓮花生、","與三根本諸本尊雲聚。","迎請","蓮師七句祈請文","吽","HŪṂ","鄔金剎土西北隅，蓮花花莖胚芽上，","稀有殊勝妙成就，得大名稱蓮花生，","周圍空行眾圍繞，我隨本尊勤修持，","祈賜加持祈降臨，咕嚕貝瑪悉地吽。","（七遍）","嗡啊吽 班札咕嚕 貝瑪 悉地吽","OṂ ĀḤ HŪṂ VAJRA GURU PADMA SIDDHI HŪṂ"]},{"sec":"三、上師相應與蓮師","en":"Essence Supplication to Guru Rinpoche","cn":"蓮師精要祈請文","p":25,"a":null,"l":["三世佛陀咕嚕仁波切，一切成就之主大樂尊，","障礙遍除降魔威猛力，至誠祈請祈請賜加持，","加持消除外內密障礙，加持所願自然得成就。","此為大伏藏師秋吉林巴於大獅天岩右方寶積岩山所引請的「應時祈請文」，","此文加持力極大，大眾應當鄭重持誦。","※念完後，進入正行，舉行薈供。","薈供","讓木洋木康木 嗡啊吽氏","RAṂ YAṂ KHAṂ OṂ ĀḤ HŪṂ HRĪḤ","於此顯相朵馬器世間，安置有情世間薈供物。","二元執著垢染皆除故，一切轉為智慧之甘露。","諸佛總集蓮花生大士，以及三根本之本尊眾，","祈願爾等心願圓滿成，祈願爾等深感心歡喜，","賜予我等共不共悉地。","三輪所緣諸種之遮障，普賢本淨界中我懺悔。"]},{"sec":"三、上師相應與蓮師","en":"Guru Rinpoche Supplication","cn":"蓮師祈請文","p":28,"a":null,"l":["供養十二地母","尤其親見持明蓮師已，十二地母及其眷屬眾，","請尊納受洗淨水朵馬，成辦修士所託之事業。","蓮師祈請文","諸佛總攝上師海生尊，垂賜加持我之身語意，","（第二句兩遍）","與三金剛融合無分別，祈願利生猶如聖上師。","頂戴無上皈依處竹慶本樂仁波切如頂上莊嚴，虔敬的弟子土登尼瑪（阿拉桑噶仁波切）將此偈言供養上師。","領受灌頂","上師以及空行母聚眾，祈賜加持我等虔敬兒，","賜予我身尊身之加持，賜予我語尊語之加持，","賜予我心尊心之加持。","懇請賜予四灌頂加持，懇請加持以淨化四續，","懇請加持以圓滿四道，懇請加持以證得四身。","嗡啊吽 班札 咕嚕 貝瑪 德伐 達其尼","OṂ ĀḤ HŪṂ VAJRA GURU PADMA DEVA ḌĀKINĪ","卡亞 阿比興恰 嗡","KĀYA ABHIṢIÑCĀ OṂ","伐卡 阿比興恰 啊","VĀKA ABHIṢIÑCĀ ĀḤ","其大 阿比興恰 吽","CITTA ABHIṢIÑCĀ HŪṂ","薩瓦 阿比興恰 氏","SARVA ABHIṢIÑCĀ HRĪḤ","※三根本的本尊眾融入光中，然後融入我身。","※靜默禪修一段時間。","願生世不離鄔金貝瑪，故而受用殊勝之正法，","圓滿五道十地諸功德，祈願速證蓮花生果位。"]},{"sec":"四、護法與供養","en":"Protector Chants","cn":"護法頌","p":30,"a":null,"l":[]},{"sec":"四、護法與供養","en":"Samantabhadra Cloud Ocean Offering","cn":"普賢雲海供","p":30,"a":null,"l":["畢歐！南無","BHYO NAMO","一髻佛母密咒護持母，及與百千隨從眷屬眾，","吾獻如海無垢妙欲供，願爾滿意令吾願任成。"]},{"sec":"四、護法與供養","en":"New Treasure Protector Short Recitation","cn":"新伏藏護法神短誦","p":30,"a":null,"l":["吽","HŪṂ","瑪哈嘎拉父續護法眾，一髻佛母母續天母眾，","大天熾燃具慢馬寧眾，尊等諸聖及與眷眾等，","受此血肉朵馬誓言物，以四事業守護佛教法，","除滅障礙仇敵與礙魔。"]},{"sec":"四、護法與供養","en":"Daily Wisdom Protector Torma Offering","cn":"智慧護法朵馬供食日課","p":31,"a":null,"l":["嗡 啊 吽 响1","OṂ ĀḤ HŪṂ HOḤ","嗡 瑪哈嘎拉 吽 呸！","OṂ MAHĀKĀLA HŪṂ PHAṬ","薩帕日以伐惹 依當木 拔玲達 卡然木 卡嘿","SAPARIVĀRA IDAṂ BALIṂTA-KHARAṂ KHĀHI","吽","HŪṂ","金剛威怒作怖善黑天，眷眾四臂虎座與六臂，","馬寧咒護四面金剛帳，尊黑聖子兄妹與僕役，","護教法故懇請臨此地。","誅滅狠毒仇敵礙魔之，聖物朵馬等此勝妙欲，","歡喜受用成就所託事。","廣揚珍貴佛陀勝教法，高舉三寶行持佛事業，","僧團弘展國政亦昌盛，亦令一切眾生得喜樂。","吾等師徒福田施主眾，外內密等障礙皆平息，","壽命福德資財皆增廣，降伏三界等業皆成辦。","滅殺一切瞋惡之仇敵，粉碎做害礙魔眾成灰，","擊退一切對立作敵者，因何制宜行表徵神變。","成辦守護擊退滅殺事，隱則不現召請則得成，","我方得勝敵方節敗退，令得迅速心想而事成。","無上悉地此生即得證，共通悉地無勤任運成，","四種佛業迅速即圓滿，徒兒眾生義利遍十方。","懇賜我力圓滿眾利樂，於諸寄望於我尊卑眾。"]},{"sec":"四、護法與供養","en":"Raksha Ghala — Garland of Skulls Supplication","cn":"羅剎嘎拉——顱鬘者祈請文","p":33,"a":null,"l" 際","色身示現日落而西沉 我心難忍哀呼上師尊","戒律圓淨藏紅法袍嚴 無逸禪定全大勇觀行","寶有全知燦爛知識海 痛切祈請無比之上師","講辯著作宣經續密意 內住等持證悟登王座","托舉解行大日具力者 教證佛法棟樑尊恆念","氣脈明點中脈和合中 三顯次第消融四空舞","幻身虹彩明光大樂身 呼喚雙運自解尊勝師","無緣空性離戲之法界 真如不壞俱生大本智","無別無漏密意虛空中 祈賜加持甘露潤我心","生生世世戒律恆清淨 經咒大海思維智慧依","明睿勝者運籌帷幄力 大樂無漏果位自解脫"]},{"sec":"五、祈請文","en":"Song of Intense Devotion — Supplication to the Great Guru","cn":"殷切虔敬曲——大恩上師祈請文","p":42,"a":"殷切虔敬曲 大恩上師祈請文.m4a","l":["上師知 上師知 上師知","當下心性有如虛空時 我父大恩上師之法身","真實佛陀德謙讓卓知 祈賜心意合一之悉地","當下顯相無非明光時 我父大恩上師報身圓","真實佛陀德謙讓卓知 祈賜心意雙運之悉地","當下心顯皆為遊戲時 我父大恩上師之化身","真實佛陀德謙讓卓知 祈賜心意不離之悉地","勝義上師尊之大悲藏 常住我虔敬心永不離","我此自心一如上師般 祈賜加持當下即了悟","從來無聚無散虔敬中 自心若能無疑作祈請","大愛悲心不倦恆看護 賜與師心無別之悉地","首先殷切祈請外上師 其次與內上師心合一","最終一味無別本解脫 利樂無盡有情大願成"]},{"sec":"五、祈請文","en":"Long Life Supplication for Dzogchen Ponlop Rinpoche","cn":"竹慶本樂仁波切長久住世祈請文","p":44,"a":null,"l":["普賢乘經典海之精華 了義明光心要大傳承","佛法寶幢弘揚遍十方 祈願勝德上師長住世"]},{"sec":"五、祈請文","en":"Prayer for the Flourishing of Dzogchen Ponlop Rinpoche’s Enlightened Activity","cn":"竹慶本樂仁波切佛行事業昌盛祈請文","p":44,"a":null,"l":["大圓滿秘密藏持有者 善教具器弟子了義法","經典教理勝幢持有者 真善知識佛行願昌盛"]},{"sec":"五、祈請文","en":"Long Life Supplication for Alaksangha Rinpoche","cn":"阿拉桑噶仁波切長久住世祈請文","p":45,"a":null,"l":["密咒明咒陀羅尼三咒 執持咒傳白袍化身者","能仁教法皓日放千光 三信心意虛空恆光耀","大悲護祐困苦有情眾 深懷信心供養三珍寶","利樂光燦蓮池盛綻放 究竟願證無二本智身"]},{"sec":"五、祈請文","en":"Long Life Supplication for Diya Chöpen Rinpoche","cn":"諦雅竹奔仁波切長久住世祈請文","p":46,"a":"諦雅竹奔仁波切祈請文.aac","l":["為教為眾清淨勝意樂 不動聰慧執持妙事蹟","噶瑪賢遍羅卓仁波切 蓮足永固事業恆昌盛","如於前世祈願所發心 究竟厭離清淨出離心","正法修持穩固如高山 精要教法持者願吉祥","不虛殊勝三寶皈依處 無死壽尊加持真諦力","我等虔信意樂眾善力 所願如是任運願成辦"]},{"sec":"五、祈請文","en":"Long Life Supplication for the Lineage Gurus","cn":"傳承上師長久住世祈請文","p":46,"a":null,"l":["祈請上師法體得安康 祈請最勝壽命恆綿長","祈請事業弘揚且興盛 祈賜加持與師不分離","祈願盛德上師蓮足固 等虛空眾悉皆生喜樂","自他無餘積資淨障已 得能迅速登入諸佛地"]},{"sec":"六、祈願與迴向","en":"Bodhicitta Aspiration","cn":"菩提心祈願文","p":47,"a":null,"l":["菩提證悟心 永為快樂因 諸佛所讚歎","清音宣流際 以其真實義 眾皆大歡喜","天魔及夜神 餓鬼等僕從","清音宣流際 願生慈愛心","勞役之家畜 野生珍稀物","清音宣流際 不畏捕殺怖","福田聖僧眾 清音宣流際 遠離諸病苦","得見深般若 當如觀世音 廣利無邊眾"]},{"sec":"六、祈願與迴向","en":"Bodhicitta Aspiration Verse","cn":"菩提心願偈","p":47,"a":null,"l":["勝菩提心寶 未生令生起","生已無退轉 願輾轉增長"]},{"sec":"六、祈願與迴向","en":"Verses of Auspiciousness","cn":"吉祥頌","p":48,"a":null,"l":["願身不動如須彌，願語具六十妙音，","願此心無量無垢，願身語意具足善。"]},{"sec":"六、祈願與迴向","en":"Dedication by Nagarjuna","cn":"龍樹菩薩迴向文","p":48,"a":null,"l":["以此功德願眾生 圓滿福德與智慧","以此福德智慧故 願能證得二妙身"]},{"sec":"六、祈願與迴向","en":"Dedication by Milarepa","cn":"密勒日巴迴向文","p":48,"a":null,"l":["願君長壽離病苦 受用自在與福樂","來世淨土願相逢 願君修行利眾生"]},{"sec":"六、祈願與迴向","en":"Khenpo Rinpoche Dedication","cn":"堪布仁波切迴向文","p":49,"a":null,"l":["願善惡緣諸眾生 捨此迷惑妄想境","西方淨土速願往 五道十地圓滿成"]},{"sec":"六、祈願與迴向","en":"Nalandabodhi Aspiration","cn":"那爛陀菩提祈願文","p":49,"a":null,"l":["聖境賢哲五明生源處 世界勝嚴吉祥那爛陀","願以精進聞思修次第 將此世間置於三菩提"]},{"sec":"六、祈願與迴向","en":"World","cn":"世界啊！","p":50,"a":"世界啊(剪).mp3","l":["世界啊我們在您懷裡生生死死","我們的苦樂在您身上自然舞動","您是我們的家從古至今","我們永遠珍惜您","願您化為那夢中的淨土","一切平等無私的國度","與慈愛溫柔的天女","擁抱著您的冀盼堅定不移","您是最親的滋養","切莫任意展露您黑暗的一面","我們要讓您的一方一土成為和平良田","千萬幸福的果實自由芬芳","圓滿成熟我們無盡的期望"]},{"sec":"七、道歌","en":"City of Dharmakaya","cn":"法身城","p":52,"a":null,"l":["我知顯相皆幻化 我執之病已去除","二元輪鍊不能縛 戰勝不動法身城"]},{"sec":"七、道歌","en":"Auspiciousness That Lights Up the Universe","cn":"吉祥光照全宇宙","p":53,"a":"吉祥光照全宇宙.mp3","l":["Namo Guru Hasa Vajra Ye","（頂禮上師喜笑金剛）","親見輪涅萬法僅緣起 且見緣起心要即法性","以此力故祥光照宇宙 喜笑金剛屹立我心中","了知根之實相離概念 且知緣起顯相如水月","以此盡除邪見與疑黯 祈願吉祥光照全宇宙","智慧照見萬法真實義 如母愛子利樂有情眾","威力轉化仇敵為弟子 祈願吉祥光照全宇宙","輪迴之因我執最勝藥 即是了知無我正法故","以息眾生我執迷惑力 祈願吉祥光照全宇宙","已然捨離凡夫世間法 了知勝義實相之聖眾","引導凡夫入於寂滅道 祈願吉祥光照全宇宙","賜予二種成就之本尊 與除惡緣障礙護法神","盡除道上一切之違緣 祈願吉祥光照全宇宙","以此世界一切之方所 無害寂靜善道盛行力","關愛之心相互深連結 祈願吉祥光照全宇宙","願此極盛豐饒之世紀 不生財富利益之紛擾","願享無爭無害之妙欲 祈願吉祥光照全宇宙","願此科學極盛之世紀 如同天人受用之機器","悉成無害和平勝方便 祈願吉祥光照全宇宙","祈願外在物質之科學 結合內在心靈之科學","以此善息心之謬誤力 祈願吉祥光照全宇宙","如是吉祥之光所生源 即是光明心之本質故","心之本質如是了知已 善妙祥光何等燦爛也","願此吉祥之光燦然處 皆以慈悲最勝菩提心","生起自他二者平等心 祈願善妙祥光不減損"]},{"sec":"七、道歌","en":"Eight Cases of Basic Goodness Not to Be Shunned","cn":"八無拒","p":55,"a":null,"l":["Namo Ratna Guru","（頂禮寶上師）","以三身藥之施予 令等虛空眾有情","消除滅盡痛苦病 禮敬尊勝樂惠施","心性虛空清淨處 若為惡業雲覆聚","即以本智大風力 無拒本淨如是行","病痛無基亦無根 無作清新鬆坦住","離言與思法身顯 無拒病痛本清淨","惑相魔障之神變 唯心而離生滅戲","離諸懼怖與怯弱 無拒鬼神本清淨","四大疾病眾苦痛 若病或癒離貪瞋","具無漏樂之妙味 無拒煩惱本清淨","諸種苦樂高與低 知其無實成道伴","希懼取捨盡遠離 無拒輪迴本清淨","人生總為病逼惱 莫視為錯莫厭棄","一味之行出莊嚴 無拒痛苦本清淨","昏沉掉舉之心識 即是法性本無垢","不思除滅之心想 無拒愚癡本清淨","由無始來之串習 如幻心念紛然現","不修空而離執實 無拒妄念本清淨","無有生死之俱生 知生滅住亦無存","無為寬廣大境界 無拒死亡本清淨","此八無拒本清淨 是需反修入一味","是尊叔侄心意趣 是破魔軍之力鎚","是我乞人之修行 是遊山間之順緣","是成二利最勝樂 老父已知汝當行"]},{"sec":"七、道歌","en":"Eighteen Kinds of Yogic Joy","cn":"瑜伽十八樂","p":57,"a":null,"l":["敬禮善妙上師足。","我以善樂福德故 得見尊顏受法教","一如上師之授記 我今依囑來居此","蒙境群山多樹木 草原花木極茂盛","於此悅意安樂堡 果樹搖擺作舞姿","猿猴撲跌作遊戲 百鳥齊喧悅耳聞","蜜蜂四飛競嗡嗡 虹彩隱顯無晝夜","冬夏細雨降霏霏 春秋谷霧瀰山際","如是寂寥山隱處 有我密勒習禪定","觀心空性明光樂 思緒眾多極快樂","猛起狂跌更加樂 無有惡業人身樂","各種紛亂極快樂 恐怖大增更加樂","煩惱生滅解脫樂 迫害越深越快樂","若無病痛更加樂 苦痛成樂此亦樂","體悟流露運動樂 跑跳舞蹈更加樂","語王妙歌寶藏樂 語如蜂鳴極快樂","聲成福德更加樂 心具大勇廣大樂","自力自顯極快樂 萬千境顯大喜樂","為酬信徒來朝拜 我今歌此作禮物","告汝法喜諸覺受 修士種種大歡樂"]},{"sec":"七、道歌","en":"The Essential Points of Mahamudra, Dzogchen, and the Middle Way","cn":"大手印、大圓滿、大中觀要義","p":59,"a":null,"l":["啊啊","具信勤智善緣諸弟子 但觀無生離戲心實相","緣處之相滅卻定信生 無勤無破無立住本然","樂空離言心性之體性 堂堂視之鬆鬆無執住","自解樂空法界光明中 直觀顯空無生心遊戲","越心本淨自生之明覺 執見地之善執自然滅","虹與光之明點紛然現 執相為實之念盡滅卻","大圓滿之行者樂陶然"]},{"sec":"七、道歌","en":"The Five Poisons Self-Liberated","cn":"五毒自解脫","p":60,"a":null,"l":["莫隨瞋恨之對境，且觀瞋恨之自心，","瞋恨自生自解脫，即是明空之本性，","明空不二非其他，即是大圓鏡智也，","於彼瞋恨自解中，念誦六字大明咒。","嗡嘛呢唄咩吽（四遍）","莫執傲慢之對境，且觀執取之自心，","執取自身最殊勝，自生自解本空性，","本空之性非其他，即是平等性智也，","於彼傲慢自解中，念誦六字大明咒。","嗡嘛呢唄咩吽（四遍）","莫執貪欲之對境，且觀執著之自心，","執著自生自解脫，即是樂空之本性，","樂空不二非其他，即是妙觀察智也，","於彼貪欲自解中，念誦六字大明咒。","嗡嘛呢唄咩吽（四遍）","莫迷嫉妒之對境，且觀細察之自心，","細察自生自解脫，即是智空之本性，","智空不二非其他，即是成所作智也，","於彼嫉妒自解中，念誦六字大明咒。","嗡嘛呢唄咩吽（四遍）","莫再誤解愚癡境，且觀愚癡之自身，","念頭自生自解脫，即是覺空之本性，","覺空不二非其他，即是法界體性智，","於彼愚癡自解中，念誦六字大明咒。","嗡嘛呢唄咩吽（四遍）"]},{"sec":"七、道歌","en":"Friends","cn":"朋友","p":62,"a":null,"l":["遠離貪著、充滿愛的瑜伽士與瑜伽女","朋友即是空相 猶如水中月","設若執以為實 徒令痛苦增","若知皆是空相 猶如水中月","如幻三昧增長 無執悲增長","無焦點見增長 離執修增長","遠離能作所作 行持將增長","一切奇蹟之中 最大之奇蹟","一切美妙之中 無上之美妙"]},{"sec":"七、道歌","en":"King Songtsen Gampo’s Song of Auspiciousness","cn":"法王松贊甘布勝住開光吉祥文","p":63,"a":null,"l":["敷設廣大供養具 登壇城已持香華","合掌啟白諦實語 合掌啟白諦實語","兩足能仁釋迦子 化身無數利群生","一切如來勝導師 十方諸佛賜吉祥","善巧大悲之續流 調伏成熟令解脫","聖者觀自在尊等 願諸菩薩賜吉祥","清淨無垢勝法教 以四攝事興正法","佛子善現尊者等 願聖長老賜吉祥","所有十方淨土中 三世一切諸如來","以及菩提薩埵等 願賜灌頂祈降臨","最勝化身法中王 妙演諦實力之時","諸佛本尊護法眾 如日光塵雲煙雨","遍滿諸佛所散華 佛子敷演菩薩行","梵天普降大華雨 天女妙獻諸供養","天樂於中出妙音 方所遍滿勝妙香","智慧薩埵滿虛空 與誓言尊無二住","諸天無量妙言辭 稱歎最勝法王已","於此最勝二殿堂 吉祥勝住任運成","照見萬法如鏡影 歌舞昇平眷眾樂","悅心喜宴年月聚 一時王者曲高歌","大悲自性三寶尊 示解脫道觀自在","於心虔誠作祈請 垂賜護念聽我歌","今日廣大虛空中 諸佛菩提薩埵眾","親見如雲海會聚 吉祥勝住任運成","諸淨梵天以妙樂 悉出無盡勝妙音","普降曼達妙華雨 吉祥勝住任運成","豎立如來正法幢 戰勝暗黑諸方所","以此伏魔威德力 吉祥勝住任運成","擊此聖教大法鼓 五毒愚癡自地息","以此三寶法鼓音 吉祥勝住任運成","喜悅之日冉冉昇 大樂之心難自抑","所欲受用如雨降 吉祥勝住任運成","本尊聖眾賜吉祥 松贊甘布成吉祥","歌此吉祥勝妙曲 願吾眷屬皆吉祥","如是歌此梵音已 普願人天皆歡喜"]},{"sec":"七、道歌","en":"Light Offering","cn":"點燈祈願文","p":69,"a":null,"l":["以此清淨光明之燈焰 獻供十方勝者與子嗣","願能祛除眾生無明暗 般若本智光輝得開顯"]},{"sec":"七、道歌","en":"Loving Key Instructions","cn":"愛的心要口訣","p":70,"a":null,"l":["啊伙！","瑜伽女和瑜伽士在一起，","當下就看著顯相和自心。","本初覺性從一開始就是清淨的，","它即是不變、原初的虛空，","雖空而顯現明光燦爛1，","它是幻相自然的反影。","在寬廣喜樂中，","我們無執享用種種悲心展現的舞蹈，","我是幸運的修士，","我心多麼歡喜！","瑜伽女和瑜伽士在一起，","要知道你的福報不可思議。","追隨釋迦牟尼佛腳步訓練自己，","佛陀教我們捨棄惡行，","實踐一切善行且調伏自心，","依止僧伽法友的友情，","我們修持最殊勝的正念與覺性","解脫的真實道路如此經歷，","我是幸運的修士，我心多麼歡喜！","瑜伽女和瑜伽士在一起，","仰視珍貴尊勝的上師。","熱切遙呼德謙讓卓——大樂自解脫1","欽哲歐瑟——悲智的明光2，","度殿尼瑪——能仁教言的太陽3，","了悟的曙光在我心中現起。","清淨覺性，自顯現的上師4，","無須禪修自然存在那裡，","上師和那弟子心心相印，","我是幸運的修士，我心多麼歡喜！","瑜伽女和瑜伽士在一起，","甚深秘密修持，多多練習！","本尊就是那自然的本初清淨，","咒語就是聲空真實聲音，","還有安然禪定三摩地，","它就是我們所說的瓶中身。","由於上師無與倫比的恩情1，","我們了悟當下真實本性——","身、語和那自心的本性。","我是幸運的修士，我心多麼歡喜！","瑜伽女和瑜伽士在一起，","要把無量的眾生放在心底。","自心迷惑顯相六道輪迴裡，","各種痛苦折磨無量無盡。","充滿慈愛心繫輪迴眾生，","就好比憐愛親愛的知己。","深深契入神聖大悲心的修持，","顯空不二如同水中月，","我心堅定願能利益他人，","我是幸運的修士，","我心多麼歡喜！","瑜伽女和瑜伽士在一起，","見證那爛陀之地的修行。","佛法五明最殊勝的是心智科學，","這聽聞思惟最深的內明，","透過精確概念修習的道途，","再加上甚深口訣的引領，","我們契入究竟離戲無念的禪定，","如此尋證菩提，多麼神奇，","啊伙，幸運修士，多麼歡喜，","啊伙，噯嗎，啊拉拉伙！"]},{"sec":"七、道歌","en":"Prayer of Solemn Commitment","cn":"決心歌","p":74,"a":null,"l":["聖那洛巴子傳解脫道，加持窮子得山居；","不為世間散亂擾，由定修觀得增長。","安住無執三昧地，勝觀之花得綻放；","不為熙攘戲論擾，離戲綠葉得增長。","崖居一心無二意，修證之果得成熟；","不為魔障所中斷，心之定解願得證。","於方便道不生疑，父傳宗風子承繼；","聖不動自性大悲者，加持窮子得山居。"]},{"sec":"七、道歌","en":"The Sampannakrama Song","cn":"圓滿次第","p":75,"a":null,"l":["我修氣脈明點時 觀習四輪三主脈","身內貪愛已盡故 身似無質自消融","諸界淨為種子字 無礙持續明朗現","見本來面無錯謬 氣集中脈擊要點","紅白二界相遇合 樂明無念自成就","心中疑結立解脫 法與心合離言說","子母光明融一味 有漏貪熾蘊界滅","顯空不二心樂然 證空不墮知解境","現見空性心樂然 一切無明與迷亂","消入廣境大樂哉"]},{" n Genuine Reality","cn":"對勝義的三種確信","p":83,"a":"23_對勝義的三種確信.mp3","l":["敬禮譯師馬爾巴 我於他鄉修行時","於無生法得定解 今生來生二執淨","六道顯相成虛妄 生死二者增益斷","於平等性得定解 苦樂二執得清淨","感受體驗成虛妄 取捨二者增益斷","於無分別得定解 輪涅二執皆清淨","道地修習成虛妄 希懼二者增益斷"]},{"sec":"七、道歌","en":"The Utpattikrama Song","cn":"生起次第","p":84,"a":null,"l":["我觀生起本尊時 此身顯空似虹彩","於此無有分別故 一切貪愛盡寂滅","我修本尊瑜伽時 親證語言如谷響","已超善惡境界故 一切取捨盡寂滅","心即明光空性也 一如日月之光輝","全無執念於其中 自我之念盡寂滅","凡夫實質身口意 轉成本來金剛體","三門已超凡界故 此心飄飄甚樂然","所行與法相應故 此心欣欣甚樂然","行法與道相應故 此心恰怡甚樂然"]},{"sec":"七、道歌","en":"The Vajra Dance of Bliss and Emptiness","cn":"樂空不二金剛舞","p":85,"a":null,"l":["啊拉拉伙","顯空不二我之身 海市蜃樓水中影","聲空不二我之語 一如幻光吉他曲","本然自由我之心 海市蜃樓水上畫","啊拉拉觀此三者 空無色相不思議","眾所周知本尊相 實僅顯空不二也","意欲無謬持咒音 實僅聲空不二也","希求開悟之智慧 實僅覺空不二也","啊拉拉且觀當下 色聲覺性之體驗","噢瑜伽士瑜伽女 酣然薈供之明光","且觀如是諸身形 何等曼妙且清明","然離種種之分別 舞動樂空幻影舞","啊拉拉且觀覺性 當下力量之展現","噢瑜伽士瑜伽女 酣然甘露之離戲","傾耳聆聽難言喻 難喻明空善妙曲","明空紛現嬉戲貌 法性覺空之歡宴","啊拉拉且觀覺性 其性靈動且燦然","樂空覺空無分別 如是薈供吾獻供","獻供大樂自解脫 成就聖眾之壇城","於此法界離一切 聚散離合之虛空","於此獻供祈加持 當下圓滿證樂空","啊拉拉伙","啊伙瑪哈蘇卡"]},{"sec":"七、道歌","en":"Verses on the Samadhi of Illusion","cn":"如幻三摩地詩偈","p":87,"a":null,"l":["知五蘊如幻 無異幻於蘊 離想行寂靜 最勝智度行","如幻作多身 謂男女象馬 是相非真實 諸法亦復然","如夢亦如幻 如乾闥婆城 其相生住滅 所說亦如是","由於諸法見真妄 故得諸法二種體 說見真境即真諦 所見虛妄名俗諦","眾生如夢幻 究時同芭蕉 涅槃不涅槃 其性悉無別"]},{"sec":"七、道歌","en":"The Way Things Are","cn":"萬物本貌","p":89,"a":"22_萬物本貌.m4a","l":["十方三世勝者與佛子 祈請慈愛看顧我等眾","聚此修持具福之行者 止觀之道無謬聖道矣","我等於此靜處禪修時 祈願此道生起於心續","此生顯相猶如水中月 了知此即萬物本貌也","尋覓離戲心性見地中 祈願確信堅固穩定也","於此所得確信禪修時 祈願無惑體證盡展現","以此力故我等作祈願 勝者珍貴教法遍宇宙","高舉教法正夫恆住世 佛行事業無遠弗屆也"]}];
const sectionMeta={"一、共修基礎儀軌":["Foundational Chants","從皈依、發心到大手印傳承與七支供養"],"二、度母修持":["Tara Practices","度母祈請、本尊修持與二十一禮讚"],"三、上師相應與蓮師":["Guru Yoga & Guru Rinpoche","上師相應法、蓮師祈請與薈供"],"四、護法與供養":["Protectors & Offerings","護法頌、朵馬供與供養祈請"],"五、祈請文":["Supplications","住世、轉世、上師與傳承祈請"],"六、祈願與迴向":["Aspirations & Dedications","菩提心、吉祥、迴向與世界啊"],"七、道歌":["Songs","主要道歌與修持歌曲"]};
const sectionOrder=["一、共修基礎儀軌","二、度母修持","三、上師相應與蓮師","四、護法與供養","五、祈請文","六、祈願與迴向","七、道歌"];
let state={view:'home',section:null,index:null,query:'',filter:'全部'};const main=document.getElementById('main');const audioCount=songs.filter(s=>s.a).length;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function goHome(){state={view:'home',section:null,index:null,query:'',filter:'全部'};render()}function openSection(sec){state={view:'section',section:sec,index:null,query:'',filter:'全部'};render()}function openSong(i,fromSec=null){state={view:'song',section:fromSec,index:i,query:'',filter:'全部'};render()}function setFilter(f){state.filter=f;state.view='home';render()}
function renderFilters(){return `<div class="filters"><button class="filter ${state.filter==='全部'?'active':''}" onclick="setFilter('全部')">全部 ${songs.length}</button><button class="filter ${state.filter==='有音檔'?'active':''}" onclick="setFilter('有音檔')">🎧 有音檔 ${audioCount}</button>${sectionOrder.map(x=>`<button class="filter ${state.filter===x?'active':''}" onclick='setFilter(${JSON.stringify(x)})'>${esc(x.replace(/^一、|^二、|^三、|^四、|^五、|^六、|^七、/,'').trim())}</button>`).join('')}</div>`}
function songCard(s,fromSec=null){return `<button class="song" onclick='openSong(${s.i},${fromSec?JSON.stringify(fromSec):'null'})'><strong>${esc(s.en||s.cn)}</strong>${s.en?`<span>${esc(s.cn)}</span>`:''}<div class="badges"><span class="badge">法本 p.${s.p}</span><span class="badge">📖 歌詞</span>${s.a?'<span class="badge audio">🎧 有音檔</span>':'<span class="badge">尚未加入音檔</span>'}</div></button>`}
function renderHome(){let q=state.query.trim().toLowerCase();let list=songs.map((s,i)=>({...s,i}));if(state.filter==='有音檔')list=list.filter(x=>x.a);else if(sectionOrder.includes(state.filter))list=list.filter(x=>x.sec===state.filter);if(q)list=list.filter(x=>(x.cn+' '+x.en).toLowerCase().includes(q));let body='';if(q||state.filter!=='全部'){body=`<div class="small">找到 ${list.length} 首</div>${list.map(x=>songCard(x,x.sec)).join('')}`}else{body=`<div class="home-note">歌曲很多，所以首頁先只顯示「分類」。點進去才看到該類歌曲。<br>目前共有 ${songs.length} 首，已上傳音檔 ${audioCount} 首。</div>${sectionOrder.map(sec=>{const arr=songs.filter(s=>s.sec===sec);const ac=arr.filter(s=>s.a).length;const m=sectionMeta[sec];return `<button class="section-card" onclick='openSection(${JSON.stringify(sec)})'><strong>${esc(sec)}</strong><div class="en">${esc(m[0])}</div><div class="desc">${esc(m[1])}</div><div class="count">${arr.length} 首｜🎧 ${ac} 首有音檔</div></button>`}).join('')}`};main.innerHTML=`<input class="search" placeholder="搜尋歌名，例如：大手印、蓮師、度母" value="${esc(state.query)}" oninput="state.query=this.value;renderHomeOnly()">${renderFilters()}${body}`}
function renderHomeOnly(){if(state.view==='home')renderHome()}
function renderSection(){const sec=state.section;const arr=songs.map((s,i)=>({...s,i})).filter(s=>s.sec===sec);main.innerHTML=`<button class="back" onclick="goHome()">← 回分類</button><h2 class="page-title">${esc(sec)}</h2><div class="page-subtitle">${esc(sectionMeta[sec][0])}｜${arr.length} 首</div>${arr.map(x=>songCard(x,sec)).join('')}`}
function renderSong(){const s=songs[state.index];const lyrics=s.l.length?s.l.map(esc).map(x=>`<p class="line">${x}</p>`).join(''):'<div class="empty">目前沒有歌詞資料</div>';const back=state.section?`openSection(${JSON.stringify(state.section)})`:'goHome()';main.innerHTML=`<button class="back" onclick='${back}'>← 回上一頁</button><h2 class="page-title">${esc(s.en||s.cn)}</h2>${s.en?`<div class="page-subtitle">${esc(s.cn)}｜法本 p.${s.p}</div>`:`<div class="page-subtitle">法本 p.${s.p}</div>`}${s.a?`<div class="audio-card"><div class="audio-label">🎧 音檔</div><audio controls preload="none" src="${encodeURI('./'+s.a)}"></audio></div>`:''}<div class="lyrics">${lyrics}</div>`}
function render(){if(state.view==='home')renderHome();else if(state.view==='section')renderSection();else renderSong()}render();
</script></body></html>
