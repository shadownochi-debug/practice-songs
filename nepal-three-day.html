let day=1;
function render(){const q=document.getElementById('q').value.trim().toLowerCase();document.getElementById('days').innerHTML=[1,2,3].map(d=>`<button class="${d===day?'on':''}" onclick="setDay(${d})">Day ${d}</button>`).join('');let out='';for(const s of [1,2,4]){const rows=(schedule[day][s]||[]).filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));if(!rows.length)continue;out+=`<section class="session"><div class="head"><b>Session ${s}</b><span>${s===1?'固定維那歌曲':s===2?'上午共修／繞塔前後':'下午共修'}</span></div>`;out+=rows.map(x=>`<button class="song" onclick="openOriginal(${JSON.stringify(x[0])},${JSON.stringify(x[1])})"><div class="en">${x[0]}</div><div class="cn">${x[1]}</div><div class="meta">${x[2]}　·　點擊查看歌詞／播放音檔</div></button>`).join('')+'</section>'}document.getElementById('app').innerHTML=out||'<div class="empty">找不到符合的歌曲。</div>'}
function setDay(d){day=d;render();window.scrollTo(0,0)}
function openOriginal(en,cn){const f=document.getElementById('oldapp');const go=()=>{const els=[...f.contentDocument.querySelectorAll('.song')];const target=els.find(el=>{const t=el.innerText||'';return t.includes(en)||t.includes(cn)});if(target){target.click();document.getElementById('viewer').style.display='block'}else{alert('這首歌目前在原歌詞資料中找不到，請先重新整理 App。')}};if(f.contentDocument&&f.contentDocument.readyState==='complete')go();else f.addEventListener('load',go,{once:true})}
function backToSchedule(){document.getElementById('viewer').style.display='none'}
document.getElementById('q').addEventListener('input',render);render();
