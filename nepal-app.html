const audioBase='https://raw.githubusercontent.com/shadownochi-debug/practice-songs/main/';
const app=document.getElementById('app'),daysEl=document.getElementById('days'),search=document.getElementById('search');let dayIdx=0;
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function songCard(cn){const x=DATA.items[cn];if(!x)return '';return `<button class="song" data-cn="${esc(cn)}"><div class="en">${esc(x.en)}</div><div class="cn">${esc(x.cn)}</div><div class="meta">📖 p.${esc(x.page)}　${esc(x.mode)}　${x.audio?'<span class="audio">🎧 有音檔</span>':'<span class="noaudio">🎧 尚無音檔</span>'}</div></button>`}
function renderDays(){daysEl.innerHTML=DATA.days.map((d,i)=>`<button class="${i===dayIdx?'on':''}" data-day="${i}">${d.day} · ${d.date}</button>`).join('')}
function renderDay(){const d=DATA.days[dayIdx];app.innerHTML=`<div class="count">${d.day}｜${d.date}｜共 ${d.sessions.length} 個實際使用場次</div>`+d.sessions.map(s=>`<section class="session"><div class="head"><b>${esc(s.name)}</b><span>${esc(s.time)}　｜　中文維那：${esc(s.umze)}</span></div>${s.groups.map(g=>`<div class="groupTitle">${esc(g[0])}</div>${g[1].map(songCard).join('')}`).join('')}</section>`).join('')}
function showSong(cn){const x=DATA.items[cn];if(!x)return;const media=x.audio?`<div class="player"><small>🎧 ${esc(x.audio)}</small>${x.audio.toLowerCase().endsWith('.mp4')?`<video controls preload="metadata" src="${audioBase+encodeURIComponent(x.audio)}"></video>`:`<audio controls preload="metadata" src="${audioBase+encodeURIComponent(x.audio)}"></audio>`}</div>`:`<div class="player"><small>🎧 目前尚未上傳音檔；歌詞仍完整保留。</small></div>`;app.innerHTML=`<div class="detail"><button class="back" id="back">← 回到 ${DATA.days[dayIdx].day} 歌曲列表</button><h2>${esc(x.en)}</h2><div class="cn">${esc(x.cn)}</div><div class="page">法本 p.${esc(x.page)}</div><span class="badge">${esc(x.mode)}</span>${x.audio?'<span class="badge">有音檔</span>':'<span class="badge">無音檔</span>'}${media}<div class="lyricsTitle">📖 完整歌詞／法本內容</div><div class="lyrics">${esc(x.lyrics)}</div></div>`;document.getElementById('back').onclick=()=>renderDay();window.scrollTo({top:0,behavior:'smooth'})}
function renderSearch(q){q=q.trim().toLowerCase();if(!q){renderDay();return}const hits=Object.values(DATA.items).filter(x=>(x.cn+' '+x.en).toLowerCase().includes(q));app.innerHTML=`<div class="count">搜尋結果：${hits.length} 首</div>`+(hits.length?hits.map(x=>songCard(x.cn)).join(''):'<div class="empty">找不到這個歌名。<br>可以試試中文名稱或 English title。</div>')}
daysEl.onclick=e=>{const b=e.target.closest('[data-day]');if(!b)return;dayIdx=+b.dataset.day;renderDays();search.value='';renderDay()};app.onclick=e=>{const b=e.target.closest('[data-cn]');if(b)showSong(b.dataset.cn)};search.oninput=()=>renderSearch(search.value);renderDays();renderDay();</script></body></html>
