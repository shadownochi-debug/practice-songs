const songs=[
{en:'Sky Dragon’s Profound Roar',cn:'天龍甚深吼',p:71,a:null,l:['本淨無生法性虛空境 我見繽紛下方之世界','細審查之無生亦無根 此即禪修無我實相時','吾財受用悉如空中虹 無實無存甚至最微處','當吾受用如幻之妙欲 顯空不二清茶與啤酒','此即安住心之圓滿月 明空不二覺性本然時','如來見修修持之次第 淨除世俗想法方便道','以此訓練自己能熟練 顯相與心無基亦無根','死亡疾病驟然降臨時 吾將準備妥當全無悔','如網世間此生之顯相 父母親友悉皆如幻夢','無常如霜原處消融時 即尋無生惑心實相時','無基空之惑相輪迴中 吾因冷熱等等而受苦','然若勤修威猛秘密乘 如狐怯懦自解時已至','華衣妙飾四大此蘊聚 吾雖供養美食諸妙欲','然此輕狂一生終了結 故應精勤令己無所懼','面對無敵死神之審判','自彼雪山環繞之佛國 吾已翻越千山與萬水','於此飛越虛空境之際 清淨吾此如幻血肉身','化為顯空不二本尊身 由此訓練自己能熟練','地道證悟任顯自解脫','哈哈德謙讓卓無著行 啊伙翔於母親廣境中']},

{en:'The Deva’s Flute: Calling Out with Longing to Khenchen Tsültrim Gyamtso, the Crown Jewel Among Millions of Siddhas and Panditas–Alak Zenkar Rinpoche',cn:'天笛之哀呼——十萬賢哲之頂嚴堪千仁波切祈請文',p:34,a:'天笛之哀呼 萬賢哲之頂嚴堪千竹清喜措仁波切祈請文.m4a',l:['南無咕嚕班扎達惹雅（敬禮上師金剛持）','智慧多聞深解經咒義 圓證深教明睿廣通達','事業浩瀚教眾之榮光 具格賢善知識護念我','心意無漏交輝如雲鬘 融於無遮法身之天際','色身示現日落而西沉 我心難忍哀呼上師尊','戒律圓淨藏紅法袍嚴 無逸禪定全大勇觀行','寶有全知燦爛知識海 痛切祈請無比之上師','講辯著作宣經續密意 內住等持證悟登王座','托舉解行大日具力者 教證佛法棟樑尊恆念','氣脈明點中脈和合中 三顯次第消融四空舞','幻身虹彩明光大樂身 呼喚雙運自解尊勝師','無緣空性離戲之法界 真如不壞俱生大本智','無別無漏密意虛空中 祈賜加持甘露潤我心','生生世世戒律恆清淨 經咒大海思維智慧依','明睿勝者運籌帷幄力 大樂無漏果位自解脫']},

let state={view:'list',q:'',filter:'all',index:0};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(s,i){return `<button class="song" onclick="openSong(${i})"><strong>${esc(s.en)}</strong><div class="cn">${esc(s.cn)}</div><div class="badges"><span class="badge">法本 p.${s.p}</span>${s.a?'<span class="badge audio">🎧 有音檔</span>':'<span class="badge">○ 待補音檔</span>'}</div></button>`}
function render(){if(state.view==='song'){let s=songs[state.index];document.getElementById('main').innerHTML=`<button class="back" onclick="state.view='list';render()">← 回歌曲列表</button><h2 class="title">${esc(s.en)}</h2><div class="subtitle">${esc(s.cn)}｜法本 p.${s.p}</div>${s.a?`<div class="audio"><div class="audio-label">🎧 已有音檔</div><audio controls preload="none" src="./${encodeURIComponent(s.a).replace(/%2F/g,'/')}"></audio></div>`:`<div class="audio"><div class="audio-label">○ 尚未加入音檔</div></div>`}<div class="lyrics">${s.l.map(x=>`<p class="line">${esc(x)}</p>`).join('')}</div>`;return}
let list=songs.map((s,i)=>({...s,i}));if(state.filter==='audio')list=list.filter(s=>s.a);if(state.filter==='missing')list=list.filter(s=>!s.a);if(state.q.trim()){let q=state.q.trim().toLowerCase();list=list.filter(s=>(s.en+' '+s.cn).toLowerCase().includes(q))}document.getElementById('main').innerHTML=`<input class="search" placeholder="搜尋中文或英文歌名" value="${esc(state.q)}" oninput="state.q=this.value;render()"><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" onclick="state.filter='all';render()">全部 ${songs.length}</button><button class="filter ${state.filter==='audio'?'active':''}" onclick="state.filter='audio';render()">🎧 有音檔 ${songs.filter(s=>s.a).length}</button><button class="filter ${state.filter==='missing'?'active':''}" onclick="state.filter='missing';render()">○ 待補音檔 ${songs.filter(s=>!s.a).length}</button></div><div class="note">依「尼泊爾三日修持」實際使用歌曲整理，並依歌詞／法本頁碼排序。搜尋可輸入中文或英文；「○ 待補音檔」就是你之後可以繼續補的項目。</div><div class="count">目前 ${list.length} 首</div>${list.map(s=>card(s,s.i)).join('')}`}
function openSong(i){state.index=i;state.view='song';render()}render();
</script></body></html>
